   further than that, and the colour would otherwise saturate and stop
   distinguishing anything. */
const gCls=v=>v>=0.5?'g4':v>=0.15?'g3':v>-0.15?'g2':v>-0.5?'g1':'g0';
const pct=v=>`${v>0?'+':''}${Math.round(v*100)}`;
/* ONE TURN OR TWO, AND NOT THREE.
   The search handles three and finishes in 29 ms, and it was offered. The
   verdict on it: "a bit unintuitive at that point when displayed this way",
   which is right, and the reason is worth writing down. Three turns of
   equilibrium play is a much stronger claim than two -- it assumes both sides
   keep playing the mix for three turns -- and the numbers stop reading as
   Pokemon-equivalents you can picture. It also buys little: the sweep across
   every documented fight shows the recommendation moving at 1 -> 2 and
   settling after. So the depth that fixed the horizon is offered, and the one
   that only adds confidence in a bigger assumption is not. */
const DEPTHS=[{d:1,label:'1 turn'},{d:2,label:'2 turns'}];

/* The look-ahead control, hoisted out of gamePanel so the doubles view can
   render one above four boards instead of four identical copies of it. */
const depthPicker=()=>`<div class="navrow gdepth"><span class="lbl">look ahead</span>${
  DEPTHS.map(x=>`<button class="minibtn${gDepth===x.d?' on':''}" data-gd="${x.d}"
    type="button">${x.label}</button>`).join('')}</div>`;

function gamePanel(me,o,pool,theirRest,withPicker=true){
  const g=turnGame(me,o,(pool||[]).filter(m=>m.name!==me.name),theirRest,gDepth);
  const picker=withPicker?depthPicker():'';
  if(!g) return `<div class="gpanel">${picker}<p class="note">This fight's roster does not
    document ${esc(o.n)}'s moves, so there is no board to solve. Every gym leader,
    Elite Four member and champion does; most route rivals do not.</p></div>`;
  const R=gameRead(g), {rows,cols,A}=g;
  /* declared before use below; see formeWarn's note */

  /* CAN THEY TAKE YOU OUT THIS TURN. Asked separately from the payoff, because
     it is a different question and the one that decides a nuzlocke: the board
     can say "you come out ahead" about a turn you do not survive. Only their
     MOVES can do it -- a switch cannot. */
  const lethal=cols.filter(c=>c.kind==='move')
    .map(c=>({mv:c.mv,d:calcIncoming(o,c.mv,me)}))
    .filter(c=>c.d&&c.d.pctHi>=100)
    .sort((a,b)=>b.d.pctLo-a.d.pctLo);
  const certain=lethal.filter(c=>c.d.pctLo>=100);

  let verdict, vcls;
  if(R.dominant>=0){
    /* Several rows can tie for it -- three moves that all one-shot are all
       equally safe. Naming one would read as a claim that the others are
       worse, so they are all named. */
    const names=R.dom.map(i=>`<b>${esc(rows[i].label)}</b>`);
    verdict=`${names.length>1
      ? `${names.slice(0,-1).join(', ')} and ${names[names.length-1]} are all safe`
      : `${names[0]} is safe`} — at least as good as anything else you could do,
      against everything they can do.`;
    vcls='ok';
  }else if(R.saddle){
    verdict=`<b>${esc(rows[R.best].label)}</b> is the move, and they have no
      punish for it — this turn has a settled answer.`;
    vcls='ok';
  }else{
    const mix=(R.sol?R.sol.x:[]).map((p,i)=>({p,i})).filter(m=>m.p>0.02)
      .sort((a,b)=>b.p-a.p);
    verdict=`No safe move — whatever you pick, there is something they can do to
      punish it. The equilibrium is a mix:
      ${mix.map(m=>`<b>${esc(rows[m.i].label)}</b> ${Math.round(m.p*100)}%`).join(' · ')}.`;
    vcls='warn';
  }

  /* Their best reply to the row you are being pointed at. "Who would they
     switch into" was the question the one-turn board could not even ask,
     because their switches were not on it. */
  /* THE ONE THING THIS BOARD KNOWINGLY GETS WRONG, said out loud.
     An opponent with an alternate forme is typed as its base species: the ROM
     records the forme (N 4's Rotom are 0..5, and their movesets prove it --
     Lava Plume, Scald, Glaciate, Hurricane, Leaf Storm) but personal.json stops
     at 649, so the forme's own typing is not extracted. Every number in the
     grid that depends on the defender's second type is therefore suspect for
     that Pokemon, and the grid has no way to know it. Saying so is the whole
     standard this page is held to. */
  const formeWarn=o.forme?`<p class="note rotnote"><b>${esc(o.n)} is an alternate
    forme (#${o.forme}) and is typed here as base ${esc(o.n)}.</b> Its moves are the
    real ones, read from the cartridge, and an immunity from its ability still
    applies — but its second TYPE is not modelled, so any column whose
    effectiveness depends on it is unreliable. Check the move's type against the
    forme yourself before trusting a number in this row.</p>`:'';
  const bestRow=A[R.best]||[];
  const jWorst=bestRow.indexOf(Math.min(...bestRow));
  const theirBest=cols[jWorst];

  const head=cols.map(c=>{
    if(c.kind==='switch') return `<th class="gsw" title="They switch to ${esc(c.mon)}">
      ${spr(c.mon)}<span class="gmv">${esc(c.mon)}</span><span class="gacc">switch</span></th>`;
    const d=MOVES[c.mv]||{};
    return `<th title="${esc(c.mv)}${d.p?` · ${d.p} power`:''}${d.acc?` · ${d.acc}% accurate`:''}">
      <span class="gmv">${esc(c.mv)}</span>${d.t?ico(d.t):''}
      ${d.acc&&d.acc<100?`<span class="gacc">${d.acc}%</span>`:''}</th>`;}).join('');

  const body=rows.map((r,i)=>{
    const worst=Math.min(...A[i]);
    return `<tr${Math.abs(R.mins[i]-R.secure)<1e-9?' class="gbest"':''}>
      <th scope="row">${r.kind==='switch'?`${spr(r.mon)}<span class="gsw">switch to
        ${esc(r.mon)}</span>`:`<span class="gmv">${esc(r.mv)}</span>${
        MOVES[r.mv]&&MOVES[r.mv].t?ico(MOVES[r.mv].t):''}`}</th>
      ${A[i].map((v,j)=>`<td class="${gCls(v)}${Math.abs(v-worst)<1e-9?' gworst':''}"
        title="You ${esc(r.label)}, they ${esc(cols[j].label)} — ${pct(v)} after ${
          g.depth} turn${g.depth>1?'s':''}${
          Math.abs(v-worst)<1e-9?', and it is the worst they can do to that choice':''}">${
          pct(v)}</td>`).join('')}
      <td class="gmin ${gCls(worst)}">${pct(worst)}</td></tr>`;}).join('');

  const horizon=g.depth===1?'after this turn':`${g.depth} turns from now`;
  return `<div class="gpanel">
    ${picker}
    ${formeWarn}
    <p class="gverdict ${vcls}">${verdict}</p>
    <p class="gsurv ${certain.length?'bad':lethal.length?'warn':'ok'}">${
      certain.length
        ? `<b>${esc(certain[0].mv)} takes you out this turn</b> — ${
            certain[0].d.pctLo.toFixed(0)}–${certain[0].d.pctHi.toFixed(0)}% of your HP, no roll saves you.`
        : lethal.length
        ? `<b>${esc(lethal[0].mv)} can take you out</b> on a high roll — ${
            lethal[0].d.pctLo.toFixed(0)}–${lethal[0].d.pctHi.toFixed(0)}%.`
        : `Nothing they have takes you out this turn.`}${
      theirBest?` Their best answer to it is <b>${esc(theirBest.label)}</b>.`:''}</p>
    <div class="gwrap"><table class="gtab">
      <thead><tr><th class="gcorner">you ╲ them</th>${head}<th class="gmin">worst</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <div class="gkey">
      <div class="gscale"><span class="g0">−100</span><span class="g1">−50</span
        ><span class="g2">0</span><span class="g3">+50</span><span class="g4">+100</span></div>
      <div class="gscale gkeytxt"><span>you lose one</span><span>losing the trade</span
        ><span>even</span><span>winning it</span><span>you take one</span></div>
    </div>
    <p class="gnote"><b>Reading it.</b> A row is a thing you could do; a column is
      a thing they could do. The cell is how the battle stands <b>${horizon}</b> if
      you both pick that, in <b>whole Pokémon</b>: +100 means you are one Pokémon
      ahead on the exchange, −100 that you are one behind${
      g.depth>1?', and past one turn it can run further than either':''}.
      Read <b>across</b> a row to see how that choice can go, and read the
      <b>worst</b> column to see how badly. The row that is ringed has the least
      bad worst case, so picking it guarantees you at least <b>${pct(R.secure)}</b>
      whatever they choose. Inside each row, the outlined cell is the answer they
      would pick.</p>
    <details class="gwhy"><summary>Why a grid, and what it assumes</summary>
      <p class="gnote">A turn is <b>simultaneous</b>: you both commit before either
        of you sees the other's choice. That makes it a game rather than a
        calculation, and it is why "how much damage does this move do" is not
        quite the question — the answer depends on what they picked. A grid is the
        honest object, and it can say the one thing a per-move calculator cannot:
        whether a move is right <b>regardless</b>.</p>
      <p class="gnote">Looking further than one turn makes it a <b>Markov game</b>,
        and the value of a position is the value of the grid whose cells are the
        values of the positions it leads to. That recursion is the whole of the
        depth control. It is also the only way a <b>switch</b> can ever look
        right: over a single turn a switch deals nothing and takes a hit, so its
        score is never positive — everything it buys you happens on the turn
        after.</p>
      <p class="gnote"><b>Stat stages are modelled</b>, which is what lets a
        Dragon Dance or a Nasty Plot be worth anything: a boost rides the
        position, scales the damage and the turn order, and is lost the moment
        that Pokémon switches out. The cost side counts too — Draco Meteor's
        −2 Sp. Atk and Close Combat's dropped defences are charged to the turn
        after. <b>Not modelled:</b> status conditions, held-item triggers,
        recoil and healing. Damage is the average roll and assumes the move
        hits, so one joint choice leads to one position rather than a spread —
        that is the assumption that makes the search finish. Accuracy is printed in the
        header rather than folded in; a crit is not modelled; a speed tie goes to
        them. ${g.undocumented?`${g.undocumented} of their team ${
          g.undocumented===1?'has':'have'} no documented moves and ${
          g.undocumented===1?'is':'are'} left out of their switches rather than
          treated as harmless. `:''}Their spread is this page's standing
        assumption — 31 IVs, 0 EVs, neutral nature — and yours is real, out of the
        save.${g.capped?' This search hit its node budget and fell back to the shallow estimate in places.':''}</p>
    </details>
  </div>`;
}

function mechBar(team){
  return `<p class="lbl" style="margin:0 0 8px">battle conditions — these change every number below</p>
    <div class="mechbar">${(team.mech||[]).map(k=>`<button class="minibtn${mechOn[k]?' on':''}"
      data-mech="${k}" title="${esc(MECH[k].hint)}">${esc(MECH[k].label)}</button>`).join('')
      ||'<span class="note">No weather or room mechanics on this team.</span>'}</div>`;
}

const KIND_LABEL={gym:'gym',elite:'elite four',rival:'rival',n:'N',plasma:'plasma',champion:'champion',story:'story'};

function battleIndex(){
  const counts={};
  OPPONENTS.forEach(e=>{counts[e.kind]=(counts[e.kind]||0)+1;});
  const kinds=['all',...Object.keys(KIND_LABEL).filter(k=>counts[k])];
  const filters=kinds.map(k=>`<button class="minibtn${encFilter===k?' on':''}" data-kf="${k}" type="button">${
    k==='all'?`all ${OPPONENTS.length}`:`${KIND_LABEL[k]} ${counts[k]}`}</button>`).join('');

  const cards=OPPONENTS.map((e,i)=>{
    if(encFilter!=='all'&&e.kind!==encFilter) return '';
    const my=myLevel();
    const gap=(e.lvmax&&my)?e.lvmax-my:null;
    const gapTxt=gap===null?'max lv':gap>0?`you are ${gap} under`:gap<0?`you are ${-gap} over`:'level with you';
    const gapCls=gap===null?'':gap>=6?'gap-bad':gap>0?'gap-warn':'gap-ok';
    const lv=e.lvmax?`<b>${e.lvmax}</b><span class="${gapCls}">${gapTxt}</span>`
                    :`<b>—</b><span>lv n/a</span>`;
    const sprites=e.team.map(o=>SPRITE[o.n]
      ? `<img class="${o.variant==='no'?'no':''}" src="${SPRITE[o.n]}" alt="${esc(o.n)}" title="${esc(o.n)}${o.l?' L'+esc(o.l):''}">`
      : '').join('');
    const isNext=i===nextFight();
    return `<button class="bcard${cleared[cKey(e)]?' past':''}${isNext?' next':''}" aria-current="${i===encIdx}" data-enc="${i}" type="button">
      <div class="btop"><span class="bord">#${String(i+1).padStart(2,'0')}</span>
        <span class="kchip k-${e.kind}">${KIND_LABEL[e.kind]}</span>
        ${cleared[cKey(e)]?'<span class="kchip k-done">done</span>':isNext?'<span class="kchip k-next">next up</span>':''}
        <span class="blv">${lv}</span></div>
      <div class="bwho">${face(e)}<div><div class="bname">${esc(e.leader)}</div>
        ${e.cls?`<div class="bcls">${esc(e.cls)}</div>`:''}
        ${e.loc?`<div class="bloc">${esc(e.loc)}</div>`:''}</div></div>
      <div class="bteam">${sprites}</div>
      <span class="donebtn" data-done="${i}" role="button" tabindex="0">${
        cleared[cKey(e)]?'✓ cleared — undo':'mark cleared'}</span></button>`;}).join('');

  return `<details class="big" id="bidxwrap"${encIdxOpen?' open':''}>
    <summary>Battle index <span class="sub">— all ${OPPONENTS.length} important fights, in story order</span></summary>
    <div class="bigbody">
      <p class="note" style="font-style:normal">The big number is the fight's <b>highest level</b> — treat it as
      the level you want to be at. Click any card to load it into the planner below.</p>
      <div class="navrow">${filters}</div>
      <div class="bidx">${cards}</div>
    </div></details>`;
}

// --- 2. THREAT BOARD: one card per enemy, sorted worst-first, so the fight
// reads as "look at the red one" rather than "read six rows".  Status colour
// always ships with a word, never colour alone.
// --- 4 & 5. RING CHARTS.  One shared geometry helper: 17 type spokes around a
// circle.  Single series each, so no legend box -- the title names it.
const RING_R=104, RING_C=132;
function ringPt(i,n,r){const a=(i/n)*Math.PI*2-Math.PI/2;
  return [RING_C+Math.cos(a)*r, RING_C+Math.sin(a)*r];}
function ringChart(vals,opts){
  const n=TYPES.length, o=opts||{};
  const scale=v=>Math.max(0.06,Math.min(1,v/(o.max||4)));
  const pts=TYPES.map((t,i)=>ringPt(i,n,RING_R*scale(vals[t]))).map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ');
  const rings=[0.25,0.5,0.75,1].map(f=>`<circle cx="${RING_C}" cy="${RING_C}" r="${(RING_R*f).toFixed(1)}"
    fill="none" stroke="var(--grid)" stroke-width="1"/>`).join('');
  const spokes=TYPES.map((t,i)=>{const [x,y]=ringPt(i,n,RING_R);
    return `<line x1="${RING_C}" y1="${RING_C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
      stroke="var(--grid)" stroke-width="1"/>`;}).join('');
  const labels=TYPES.map((t,i)=>{const [x,y]=ringPt(i,n,RING_R+15);
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle"
      font-size="8.5" fill="var(--axis)" font-family="ui-monospace,monospace">${t.slice(0,3)}</text>`;}).join('');
  const dots=TYPES.map((t,i)=>{const [x,y]=ringPt(i,n,RING_R*scale(vals[t]));
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${o.color}"
      stroke="var(--card)" stroke-width="2"><title>${t}: ${o.fmt?o.fmt(vals[t]):vals[t]}</title></circle>`;}).join('');
  return `<svg viewBox="0 0 264 264" role="img" class="ringsvg"
    aria-label="${esc(o.label||'')}">${rings}${spokes}
    <polygon points="${pts}" fill="${o.color}" fill-opacity="0.18" stroke="${o.color}" stroke-width="2"/>
    ${dots}${labels}</svg>`;
}
function defenceRadar(pool){
  const v={}; TYPES.forEach(t=>{v[t]=Math.max(...pool.map(m=>eff(t,m)),0);});
  return ringChart(v,{color:'var(--s1)',max:4,label:'worst damage taken per type',fmt:x=>'×'+x});
}
// What to DO about the shape: the worst hits, and the types nobody absorbs.
function defenceTakeaway(pool){
  const rows=TYPES.map(t=>{
    const worst=pool.reduce((a,m)=>eff(t,m)>eff(t,a)?m:a,pool[0]);
    return {t,max:eff(t,worst),who:worst.name,
            resists:pool.filter(m=>eff(t,m)<1).length};});
  const quad=rows.filter(r=>r.max>=4).sort((a,b)=>b.max-a.max);
  const naked=rows.filter(r=>r.max>1&&!r.resists).sort((a,b)=>b.max-a.max);
  const safe=rows.filter(r=>r.max<=1).length;
  const bits=[];
  if(quad.length) bits.push(`<b>×4 danger:</b> ${quad.map(r=>`${r.t} on ${esc(r.who)}`).join(', ')} — never lead them into it.`);
  if(naked.length) bits.push(`<b>No switch-in:</b> ${naked.slice(0,4).map(r=>r.t).join(', ')} — nothing on this six resists ${naked.length>1?'these':'it'}, so you have to out-damage ${naked.length>1?'them':'it'}.`);
  bits.push(`${safe} of 17 types can’t hurt anyone here worse than ×1.`);
  return `<p class="takeaway">${bits.join(' ')}</p>`;
}
function offenceVals(pool){
  const v={}; TYPES.forEach(t=>{v[t]=0;});
  pool.forEach(m=>m.moves.forEach(mv=>{const d=MOVES[mv];
    if(!d||d.c==='status')return;
    TYPES.forEach(t=>{const x=CHART[d.t][t]; if(x>v[t]) v[t]=x;});}));
  return v;
}
function offenceRing(pool){
  return ringChart(offenceVals(pool),{color:'var(--s2)',max:2,
    label:'best multiplier you can hit each type for',fmt:x=>'×'+x});
}
function offenceTakeaway(pool){
  const v=offenceVals(pool);
  const cold=TYPES.filter(t=>v[t]<=0.5), flat=TYPES.filter(t=>v[t]===1);
  const bits=[];
  if(cold.length) bits.push(`<b>Resisted everywhere:</b> ${cold.join(', ')} — you have no move that gets past ${cold.length>1?'these':'it'}. Bring a swap or stall.`);
  if(flat.length) bits.push(`<b>Only neutral:</b> ${flat.slice(0,6).join(', ')}${flat.length>6?` +${flat.length-6}`:''} — beatable, just slowly.`);
  bits.push(`${TYPES.filter(t=>v[t]>=2).length} of 17 types you hit super-effectively.`);
  return `<p class="takeaway">${bits.join(' ')}</p>`;
}

// --- 6. LEVEL CURVE.  Your level against every documented fight, in story
// order.  Two series, so the legend is always present and both are direct-
// labelled.  One y-axis only: both series are levels, same scale.
function levelCurve(pool){
  const pts=OPPONENTS.map((e,i)=>({i,lv:e.lvmax,name:e.leader,kind:e.kind}))
                     .filter(p=>p.lv);
  if(pts.length<2) return '';
  const my=Math.max(...pool.map(m=>m.lvl||0),1);
  const W=660,H=250,PL=34,PR=14,PT=14,PB=26;
  const maxLv=Math.max(100,...pts.map(p=>p.lv));
  const x=i=>PL+(i/(OPPONENTS.length-1))*(W-PL-PR);
  const y=v=>PT+(1-v/maxLv)*(H-PT-PB);
  const path=pts.map((p,k)=>`${k?'L':'M'}${x(p.i).toFixed(1)},${y(p.lv).toFixed(1)}`).join('');
  const grid=[0,25,50,75,100].map(v=>`<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}"
      stroke="var(--grid)" stroke-width="1"/>
    <text x="${PL-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="9"
      fill="var(--axis)" font-family="ui-monospace,monospace">${v}</text>`).join('');
  const dots=pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.lv).toFixed(1)}" r="4"
      fill="var(--s2)" stroke="var(--card)" stroke-width="2">
      <title>${esc(p.name)} — level ${p.lv}</title></circle>`).join('');
  const first=pts[0], last=pts[pts.length-1];
  return `<div class="curve">
    <div class="lgnd"><span><i style="background:var(--s1)"></i>your level (${my})</span>
      <span><i style="background:var(--s2)"></i>fight level</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="your level against each fight's level, in story order">
      ${grid}
      <line x1="${PL}" y1="${y(my).toFixed(1)}" x2="${W-PR}" y2="${y(my).toFixed(1)}"
        stroke="var(--s1)" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="${W-PR}" y="${(y(my)-6).toFixed(1)}" text-anchor="end" font-size="10"
        fill="var(--s1)" font-family="ui-monospace,monospace" font-weight="700">you · ${my}</text>
      <path d="${path}" fill="none" stroke="var(--s2)" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <text x="${x(first.i).toFixed(1)}" y="${H-8}" font-size="9" fill="var(--axis)"
        font-family="ui-monospace,monospace">#1</text>
      <text x="${(W-PR).toFixed(1)}" y="${H-8}" text-anchor="end" font-size="9" fill="var(--axis)"
        font-family="ui-monospace,monospace">#${OPPONENTS.length} · ${esc(last.name)}</text>
    </svg>
    <p class="abkey">${pts.filter(p=>p.lv>my).length} of ${pts.length} documented fights are above your
      current level. ${OPPONENTS.length-pts.length} more have no level in Drayano's tables.</p>
  </div>`;
}

function threatBoard(pool,e){
  const cards=e.team.map(o=>{
    const om=oppMon(o), ot=om.types;
    /* Your best answer: the (Pokémon, move) that takes the most off it. */
    let bestOut=null;
    pool.forEach(m=>(m.moves||[]).forEach(mv=>{
      const d=calcDamage(m,mv,om);
      if(d&&(!bestOut||d.pctLo>bestOut.d.pctLo)) bestOut={m,mv,d};
    }));
    /* WHAT IT DOES BACK, to that exact Pokémon.
       The board used to compute a `worstIn` type multiplier against your whole
       team and then throw it away, so a "threat board" said nothing about the
       threat -- only about your answer. It now costs the pairing the card is
       actually recommending: if you bring Excadrill, this is what Excadrill
       takes. calcIncoming() did not exist when this was first written. */
    const target=bestOut?bestOut.m:null;
    let bestIn=null;
    if(target) (o.m||[]).filter(mv=>MOVES[mv]).forEach(mv=>{
      const d=calcIncoming(o,mv,target);
      if(d&&(!bestIn||d.pctHi>bestIn.d.pctHi)) bestIn={mv,d};
    });
    /* Rivals and N carry no documented moves -- their rosters come from the
       ROM's trainer table rather than Drayano's doc. Fall back to the type
       read, which is what this board always showed, and SAY it is one. */
    let typeIn=0;
    if(target) ot.forEach(ty=>{const x=eff(ty,target); if(x>typeIn) typeIn=x;});
    const es=enemySpe(o), ms=target?spdOf(target):null;
    const first=(es==null||ms==null)?null:(trOn()?ms<es:ms>es);

    const youKO=!!bestOut&&bestOut.d.pctLo>=100;
    const you2=!!bestOut&&bestOut.d.pctLo>=50;
    const theyKO=!!bestIn&&bestIn.d.pctHi>=100;
    /* Worst first, and the word always carries the meaning -- colour alone
       never does. `rank` ascends with safety so the sort is one comparison. */
    let state,word,rank;
    if(theyKO&&first===false){ state='bad'; word='it kills you first'; rank=0; }
    else if(theyKO){ state='bad'; word='it can kill back'; rank=1; }
    else if(!bestOut){ state='bad'; word='nothing connects'; rank=2; }
    else if(!you2){ state='bad'; word='slow to kill'; rank=3; }
    else if(!youKO){ state='warn'; word='takes two turns'; rank=4; }
    else if(first===false){ state='warn'; word='OHKO, but second'; rank=5; }
    else { state='ok'; word='OHKO, and first'; rank=6; }
    return {o,om,ot,bestOut,bestIn,typeIn,first,state,word,rank};
  }).sort((a,b)=>a.rank-b.rank);

  const legend=`<div class="tlegend">
    <span><i class="t-bad"></i>it can take one of yours out</span>
    <span><i class="t-warn"></i>you win it, but not cleanly</span>
    <span><i class="t-ok"></i>you knock it out and move first</span></div>`;

  const koChip=(d,cls)=>d&&d.ko?`<span class="tko ${cls}">${esc(d.ko)}</span>`:'';

  /* A column count that leaves no orphan row. Six as 3+3, four as 2+2, three
     in a line; five is 3+2, which is the least bad a prime allows. */
  const n=cards.length;
  const cols=n<=3?Math.max(1,n):(n%3===0?3:(n%2===0?2:3));
  return legend+`<div class="threats" style="--tcols:${cols}">${cards.map(c=>`<div class="tcard2 t-${c.state}">
      <div class="thead">${spr(c.o.n,'osp')}
        <div class="tid"><div class="mname">${esc(c.o.n)}</div>
          <div class="tmeta">L${esc(c.o.l||'?')} · ${esc(c.o.a||'—')}${
            c.o.i&&c.o.i!=='-'?' · @'+esc(c.o.i):''}</div>
          <div class="ttypes">${c.ot.map(ico).join('')}</div></div></div>
      <div class="tverdict k-${c.state}">${esc(c.word)}</div>
      ${c.bestOut?`
      <div class="tduel">
        <div class="tside">
          <span class="tk">you bring</span>
          <span class="tv">${spr(c.bestOut.m.name)}<b>${esc(c.bestOut.m.name)}</b>
            <span class="tmv">${esc(c.bestOut.mv)}</span></span>
          <span class="tbar">${hpBar(c.bestOut.d)}<span class="dmg">${
            dmgTxt(c.bestOut.d)}</span>${koChip(c.bestOut.d,'good')}</span>
        </div>
        <div class="tord ${c.first===null?'':c.first?'f':'s'}">${
          c.first===null?'speed ?':c.first?'▲ you move first':'▼ it moves first'}</div>
        <div class="tside">
          <span class="tk">it answers</span>
          ${c.bestIn?`<span class="tv"><b>${esc(c.bestIn.mv)}</b>
              <span class="tmv">into ${esc(c.bestOut.m.name)}</span></span>
            <span class="tbar">${hpBar(c.bestIn.d)}<span class="dmg">${
              dmgTxt(c.bestIn.d)}</span>${koChip(c.bestIn.d,'bad')}</span>`
            :`<span class="tv"><span class="mult ${MCLASS(c.typeIn)}">${MTXT(c.typeIn)}</span>
              <span class="tmv">on ${esc(c.bestOut.m.name)}</span></span>
             <span class="tbar lbl">type read only — this fight's roster does not
               document its moves</span>`}
        </div>
      </div>`
      :'<div class="tduel"><div class="tside"><span class="tk">you bring</span>'
       +'<span class="tv"><b>nothing that connects</b></span></div></div>'}
    </div>`).join('')}</div>`;
}

// --- 3. SPEED LADDER: both sides on ONE axis, so who-outruns-whom is spatial
// rather than arithmetic.  Two series, so a legend is always present.
function speedLadder(pool,e){
  const mine=pool.map(m=>({n:m.name,s:spdOf(m),mine:true}));
  const theirs=e.team.map(o=>{const b=(DEX[o.n]||{}).b, l=parseInt(o.l,10)||50;
    return b?{n:o.n,s:Math.floor((2*b[5]+31)*l/100)+5,mine:false}:null;}).filter(Boolean);
  const all=[...mine,...theirs];
  if(!all.length) return '';
  const hi=Math.max(...all.map(x=>x.s),1), lo=Math.min(...all.map(x=>x.s));
  const span=Math.max(1,hi-lo);
  const inv=trOn();
  const rows=[...all].sort((a,b)=>inv?a.s-b.s:b.s-a.s);
  const slowest=Math.min(...mine.map(x=>x.s));
  const beaten=theirs.filter(t=>inv?t.s>slowest:t.s<slowest).length;
  return `<div class="ladder">
    <div class="lgnd"><span><i style="background:var(--s1)"></i><b>YOU</b></span>
      <span><i style="background:var(--s2)"></i><b>THEM</b></span>
      <span class="lbl">${inv?'Trick Room active — slowest moves first'
        :`even your slowest outruns ${beaten} of their ${theirs.length}`}</span></div>
    ${rows.map(x=>`<div class="lrow ${x.mine?'me':'opp'}">
      <span class="lside">${x.mine?'YOU':'THEM'}</span>
      <span class="lname">${spr(x.n)}${esc(x.n)}</span>
      <span class="ltrack"><i style="width:${Math.max(3,Math.round((x.s-lo)/span*100))}%;
        background:${x.mine?'var(--s1)':'var(--s2)'}"></i></span>
      <span class="lval">${x.s}</span></div>`).join('')}
  </div>`;
}

/* DOUBLES, AS THE PAIRINGS RATHER THAN AS ONE GAME.
   A real doubles turn is a single simultaneous game over joint actions: each
   side moves two Pokemon at once, so the grid is every pair of your actions
   against every pair of theirs. That is roughly 20,000 cells at one turn of
   look-ahead and 400 million at two, and it would still be WRONG without
   modelling spread damage, redirection and ally-targeting -- which is why
   this page used to refuse and say so.

   Refusing is still the honest answer to "solve my doubles turn". It is a
   poor answer to the question people actually have, which is "how does each
   of mine do against each of theirs". That decomposes into four ordinary
   one-on-one games, and those this page already solves exactly.

   So: four boards, and a disclaimer that names what the decomposition drops
   rather than implying the product of four games is the real one. Folded, one
   open at a time, because four full grids at once is not a tool. */
function pairBoards(pool,e,mineNames,theirNames){
  /* The fielded names are PARAMETERS with the globals as the default. They
     were read straight off fieldM/fieldE, which made this untestable without
     driving the whole page: the check called it, got nothing back, and passed
     because the assertion allowed zero boards. Both halves of that were wrong. */
  const mine=(mineNames||fieldM).map(n=>pool.find(m=>m.name===n)).filter(Boolean);
  const theirs=(theirNames||fieldE).map(k=>eFind(e.team,k)).filter(Boolean);
  if(!mine.length||!theirs.length) return '';
  const pairs=[];
  for(const me of mine) for(const o of theirs) pairs.push([me,o]);
  /* A PICKER ABOVE THE BOARD, NOT FOLDS BELOW IT.
     These were four <details>, first one open. The other three sat under a
     solved grid tall enough to push them off screen, so the view read as "one
     board" and the remaining three matchups -- half the information in a
     doubles fight -- were there but unfindable. A row of choices you can see
     is not the same as a row of choices you can reach.
     Laid out as sprite-vs-sprite so the pairing is legible without reading,
     and kept in a 2x2 so it maps onto the two-against-two it describes.
     Persistent, so you can flick between matchups while deciding a lead
     instead of opening and closing them. */
  if(pairIdx>=pairs.length) pairIdx=0;
  const tabs=pairs.map(([me,o],i)=>`<button class="pairbtn${i===pairIdx?' on':''}"
      data-pair="${i}" type="button">
      ${spr(me.name)}<span class="pvs">vs</span>${spr(o.n)}
      <span class="pnm">${esc(me.name)} <i>vs</i> ${
        esc(eLabel(e.team,o,e.team.indexOf(o)))}</span></button>`).join('');
  const [pm,po]=pairs[pairIdx];
  const cards=`<div class="pairgrid" style="--pcols:${theirs.length}">${tabs}</div>
    <div class="pairgame">${gamePanel(pm,po,pool,e.team.filter(x=>x!==po),false)}</div>`;
  return `<div class="gpair">
    ${depthPicker()}
    <p class="note"><b>${pairs.length} one-on-one boards, not a doubles solver.</b>
      Each board below is the exact simultaneous game for that pairing, solved the
      same way as a singles turn. What this does <b>not</b> model is everything that
      makes doubles its own game: spread moves hitting both your Pokémon at 75%,
      redirection (Follow Me, Lightning Rod, Storm Drain), ally-targeting support
      like Helping Hand, Wide Guard, and the fact that your two choices are made
      together rather than independently. Treat each board as "how does this one
      fare against that one", which is the question worth asking before you lead —
      not as the value of the turn.</p>
    ${cards}</div>`;
}

function encounterPanel(mons,team,idx){
  /* `idx` is a PARAMETER with the page's own encIdx as the default -- the same
     fix pairBoards needed. Reading the global outright meant a check could
     only ever inspect whichever fight the page happened to be on, so asserting
     anything about a specific one silently tested fight zero instead. */
  const list=OPPONENTS, e=list[Math.min(idx==null?encIdx:idx,list.length-1)];
  // Derive the format from the fight the FIRST time this fight is rendered.
  // Guarded on the key rather than done unconditionally, so toggling Singles
  // on a double battle -- to reason about one pairing -- survives the redraw
  // that the toggle itself triggers.
  const ekey=cKey(e);
  if(fmtFor!==ekey){ fmt=fmtOf(e); fmtFor=ekey; fieldE=[]; fieldM=[]; pairIdx=0; }
  const active=mons.filter(m=>!benched[m.name]);
  const pool=active.length?active:mons;
  const cap=fmt==='doubles'?2:1;
  fieldE=fieldE.filter(k=>eFind(e.team,k)).slice(0,cap);
  fieldM=fieldM.filter(n=>pool.some(m=>m.name===n)).slice(0,cap);

  const chips=mons.map(m=>`<button class="pchip${benched[m.name]?' off':''}" data-bench="${esc(m.name)}">
     ${spr(m.name)}<span>${esc(m.name)}</span></button>`).join('');

  const score=pool.map(m=>{
    let walls=0,hits=0;
    e.team.forEach(o=>{const d=DEX[o.n]; if(!d)return;
      const om=oppMon(o);
      if(Math.max(...d.t.map(t=>eff(t,m)))<1) walls++;
      let b=0; m.moves.forEach(mv=>{const mm=MOVES[mv]; if(!mm||mm.c==='status')return;
        b=Math.max(b,dealTo(mm.t,om));});
      if(b>=2) hits++;});
    return {m,walls,hits,v:hits*2+walls};
  }).sort((a,b)=>b.v-a.v);

  const theirTeam=e.team.map(o=>{
    const om=oppMon(o), ot=om.types;
    const rows=ot.length?rankRows(pool,ot,om):[];
    const wall=rows[0], hit=rows.length?[...rows].sort((a,b)=>b.deals-a.deals)[0]:null;
    return `<details class="omonD${o.variant==='no'?' dim':''}"><summary>
        ${spr(o.n,'osp')}<span class="oname">${esc(o.n)}</span>
        <span class="olv">${o.l?'L'+esc(o.l):''}</span>${ot.map(ico).join('')}
        ${o.variant==='no'?'<span class="lbl">other starter</span>':''}
        <span class="olv">${esc(o.a||'')}${o.i&&o.i!=='-'?' @'+esc(o.i):''}</span>
        <span class="oans">${wall?`<span class="lbl">wall</span>${spr(wall.m.name)}
          <span class="mult ${MCLASS(wall.takes)}">${MTXT(wall.takes)}</span>`:''}
          ${hit?`<span class="lbl">hit</span>${spr(hit.m.name)}
          <span class="mult ${MCLASS(hit.deals)}">${MTXT(hit.deals)}</span>${
            hit.dmg?`<span class="dmg">${dmgTxt(hit.dmg)}</span>`:''}`:''}</span></summary>
      <div class="odetail">
        ${o.m&&o.m.length?`<p class="omoves">${o.m.map(esc).join(' · ')}</p>`:''}
        ${rows.length?rankHTML(rows):'<p class="note">No typing data.</p>'}</div></details>`;
  }).join('');

  const eBtns=e.team.map((o,i)=>`<button class="fbtn${
      fieldE.includes(eKey(o,i))?' on':''}" data-fe="${esc(eKey(o,i))}">
      ${spr(o.n)}<span>${esc(eLabel(e.team,o,i))}</span></button>`).join('');
  const mBtns=pool.map(m=>`<button class="fbtn${fieldM.includes(m.name)?' on':''}" data-fm="${esc(m.name)}">
      ${spr(m.name)}<span>${esc(m.name)}</span></button>`).join('');
  const cards=fieldM.map(mn=>{const me=pool.find(x=>x.name===mn); if(!me) return '';
    const tot=(me.stats||[0]).reduce((a,b)=>a+b,0);
    // The same what-if control the roster carries. Evaluating a fight is
    // exactly when you want it -- "does Dragon Dance let me outspeed this" is
    // the question the mock exists to answer -- and boostRow() feeds the same
    // bState, so the damage, the speed order and the matrices all move
    // together. Empty for a Pokémon that knows no stat move.
    return `<div class="mcard"><div class="mhead">${spr(me.name)}
        <div><div class="mname">${esc(me.name)}</div>
        <div class="lbl">spe ${spdOf(me)} · total ${tot}</div></div></div>
      ${boostRow(me)}
      ${fieldE.map(k=>{const o=eFind(e.team,k); return o?matchLine(me,o):'';}).join('')}
    </div>`;}).join('');

  const lvTxt=e.lvmax?(e.lvmin&&e.lvmin!==e.lvmax?`L${e.lvmin}–${e.lvmax}`:`L${e.lvmax}`):'levels not documented';
  return `<div class="panel" id="encpanel">
    <div class="mechwrap">${mechBar(team)}</div>
    <div class="navrow">
      <button class="minibtn" id="encprev" type="button">◀ prev</button>
      <select id="encsel">${list.map((x,i)=>`<option value="${i}"${i===encIdx?' selected':''}>
        ${esc(x.leader)}${x.loc?' — '+esc(x.loc):''}</option>`).join('')}</select>
      <button class="minibtn" id="encnext" type="button">next ▶</button>
      <span class="lbl">${encIdx+1} of ${list.length}</span>
    </div>
    <p class="oppline">${face(e,'big')}<span class="kchip k-${e.kind}">${KIND_LABEL[e.kind]}</span>
      <b>${esc(e.leader)}</b>${e.cls?`<span class="lbl">${esc(e.cls)}</span>`:''}${
      e.loc?`<span class="lbl">${esc(e.loc)}</span>`:''}
      <span class="mult ${e.lvmax?'m2':'m1'}">${lvTxt}</span>
      <span class="lbl">${e.team.length} Pokémon</span>
      ${e.type?`<span class="lbl">${esc(e.type)}</span>`:''}
      ${e.reward?`<span class="lbl">reward ${esc(e.reward)}</span>`:''}
</p>
    ${e.note?`<p class="note">${e.note}</p>`:''}
    <div class="navrow" style="margin-top:10px">
      <span class="lbl">your notes</span>
      <input id="encnote" value="${esc(encNotes[encIdx]||'')}" placeholder="what beat you, what to bring…"
        style="font:14px var(--sans);flex:1;min-width:220px;padding:9px 11px;border-radius:9px;
        border:1px solid var(--rule);background:var(--card-3);color:var(--ink)">
      <button class="minibtn${cleared[cKey(e)]?' on':''}" id="encdone" type="button">${
        cleared[cKey(e)]?'✓ cleared':'mark cleared'}</button>
    </div>

    <h4 class="subhead">Your six
      <span>click any one to bench it — every number below recomputes</span></h4>
    <div class="subbody"><div class="pchips">${chips}</div></div>

    <h4 class="subhead">Most useful in this fight</h4>
    <div class="subbody"><div class="rank">${score.map((s,i)=>`<div class="rrow${i===0?' best':''}">${spr(s.m.name)}
      <span class="rn">${esc(s.m.name)}</span>
      <span class="lbl">walls</span><span class="mult ${s.walls?'m5':'m1'}">${s.walls}/${e.team.length}</span>
      <span class="spacer"></span><span class="lbl">hits hard</span>
      <span class="mult ${s.hits?'m2':'m1'}">${s.hits}/${e.team.length}</span></div>`).join('')}</div></div>

    <h4 class="subhead">Threat board
      <span>every Pokémon they have, worst first · what you bring, what it does back, and who moves
      first — the exchange you actually get if you follow the card</span></h4>
    <div class="subbody">${threatBoard(pool,e)}</div>

    <h4 class="subhead">Your move
      <span>Choose ${cap===1?'one Pokémon':'two Pokémon'} on each side. You get that exact pairing
      worked out — your hardest-hitting move, what it takes off them, who moves first — and then,
      because neither of you can see the other's choice before committing, what is actually
      <b>safe</b>. Use it to test a lead before you commit to one.</span></h4>
    <div class="subbody">
      <div class="navrow" style="margin-bottom:12px">
        <span class="lbl">format</span>
        <button class="minibtn${fmt==='singles'?' on':''}" data-fmt="singles" type="button">Singles</button>
        <button class="minibtn${fmt==='doubles'?' on':''}" data-fmt="doubles" type="button">Doubles</button>
        <span class="lbl">pick ${cap} on each side</span>
        ${e.type?`<span class="lbl" style="margin-left:auto">this fight is a <b>${esc(e.type)}</b></span>`:''}
      </div>
      <p class="lbl">their side</p><div class="fbtns">${eBtns}</div>
      <p class="lbl" style="margin-top:10px">your side</p><div class="fbtns">${mBtns}</div>
      ${(fieldM.length&&fieldE.length)?`<div class="pairs">${cards}</div>`
        :'<p class="note">Pick at least one on each side to see the plan.</p>'}
      ${isRotation(e)?`<p class="note rotnote"><b>This is a Rotation Battle.</b>
        Only one Pokémon per side is on the field at a time, so the board below is
        exactly right for the pairing you are looking at — this is a singles turn,
        not a doubles one. What it does <b>not</b> model is the rotation itself:
        they field <b>three</b>, and swapping between them costs them
        <b>no turn at all</b>, where a switch would. So treat "they are locked into
        this" as false — check the other two on their side before you commit to a
        lead, because they can answer you for free and you cannot.</p>`:''}
      ${(fmt==='singles'&&fieldM.length===1&&fieldE.length===1)
        ? gamePanel(pool.find(m=>m.name===fieldM[0]), eFind(e.team,fieldE[0]), pool,
            e.team.filter(x=>x!==eFind(e.team,fieldE[0])))
        : (fmt==='doubles'&&fieldM.length&&fieldE.length)
        ? pairBoards(pool,e)
        : (fieldM.length&&fieldE.length)
        ? '<p class="note">Exactly one on each side to see what is safe.</p>'
        : ''}
    </div>

    <h4 class="subhead">Speed ladder
      <span>both sides on one axis · anything below you moves after you</span></h4>
    <div class="subbody">${speedLadder(pool,e)}</div>

    <h4 class="subhead">Their team in detail
      <span>click any one for the full per-Pokémon ranking</span></h4>
    <div class="subbody"><div class="gbody">${theirTeam}</div></div>
  </div>`;
}

function render(team){
  const tid=team.id, mons=cur(team), baseWeak=weakCount(mons);
  // one scale across every Pokemon on this tab, including swap options,
  // so a bar means the same thing on every card
  // Scale the bars against EFFECTIVE stats, not raw ones.  bars() renders the
  // ability-adjusted number, so a raw maximum let Huge Power's 162 Attack draw
  // a bar on a scale that topped out at 117 -- the bar simply ran off the end.
  const SK=['hp','atk','def','spa','spd','spe'];
  const effOf=o=>SK.map(k=>statOf(o.mon,k));
  const gmax=Math.max(...team.slots.flatMap(s=>s.options.flatMap(o=>effOf(o))),1);
  const tmax=Math.max(...team.slots.flatMap(s=>s.options.map(o=>effOf(o).reduce((a,b)=>a+b,0))),1);
  const slots=team.slots.map((s,i)=>{
    const ch=Math.min(pick[tid][i],s.options.length-1), m=s.options[ch].mon;
    const branch=s.options.length>1?`<div class="branch"><p class="bl">swap this slot</p>
      ${s.options.map((o,j)=>{
        const test=mons.slice(); test[i]=o.mon;
        const dw=weakCount(test)-baseWeak;
        const cls=dw<0?'d-good':dw>0?'d-bad':'d-same';
        const txt=j===ch?'currently selected':dw===0?'no change to team weaknesses'
          :dw<0?`${-dw} fewer team weakness${dw===-1?'':'es'}`:`${dw} more team weakness${dw===1?'':'es'}`;
        return `<button class="opt" aria-current="${j===ch}" data-s="${i}" data-o="${j}">
          ${spr(o.mon.name,'sp')}<span><span class="on">${esc(o.mon.name)}</span><br>
          <span class="od">${esc(o.mon.box)} · ${esc(o.mon.ab)}</span></span>
          ${o.badge?`<span class="badge">${esc(o.badge)}</span>`:(j===0?'<span class="badge">default</span>':'')}
          </button><span class="delta ${cls}">${txt}</span>
          ${o.note?`<p class="optnote">${o.note}</p>`:''}
          ${o.rigged?`<div class="rigged"><span class="rlab">Engineered</span><span>${o.rigged}</span></div>`:''}`;}).join('')}</div>`:'';
    return `<div class="slot"><div class="card">
      <div class="top"><span class="num">SLOT ${i+1}</span><span class="chip ${s.role}">${s.role}</span></div>
      ${monBlock(m,s.why,gmax,tmax)}</div>${branch}</div>`;
  }).join('');

  const tgrid=TYPES.map(t=>{
    const rows=rankRows(mons,[t]);
    const wall=rows[0], hit=[...rows].sort((a,b)=>b.deals-a.deals)[0];
    return `<details class="tcard"><summary>${ico(t)}<span class="tn">${t}</span>
      <span class="pair">${spr(wall.m.name)}
        <span class="mult ${MCLASS(wall.takes)}">${MTXT(wall.takes)}</span></span></summary>
      <div class="tbody">${rankHTML(rows)}</div></details>`;}).join('');

  const spd=mons.map(m=>({m,s:spdOf(m),base:m.stats?m.stats[5]:0}));
  spd.sort((a,b)=>trOn()?a.s-b.s:b.s-a.s);

  const mat=`<div class="matwrap"><table class="mat"><thead><tr><th></th>
    ${mons.map(m=>`<th>${spr(m.name)}<span class="hn">${esc(m.name)}</span></th>`).join('')}</tr></thead>
    <tbody>${TYPES.map(at=>`<tr><td class="tl">${ico(at)}${at}</td>
      ${mons.map(m=>{const e=eff(at,m), ab=effAbil(at,m);
        return `<td><span class="cell ${MCLASS(e)}"${ab?` title="${esc(ab)}"`:''}>${MTXT(e)}${
          ab?'<sup class="abmark">a</sup>':''}</span></td>`;}).join('')}
    </tr>`).join('')}</tbody></table></div>`;

  document.getElementById('view').innerHTML=`
   <div class="wrap">
    <section class="zone" style="border-top:none;margin-top:0;padding-top:0">
      <div class="panel strip"><h3>${esc(team.name)}</h3>
      <p class="whereline">
        <span class="lbl">core</span>
        <b class="st-${esc(team.state||'')}">${team.state==='fielded'?'in your party'
          :team.inParty?`${team.inParty} of ${team.coreN} in party, rest in ${esc((team.coreBoxes||[]).join(' + '))}`
          :esc((team.coreBoxes||[]).join(' + ')||'not in the save')}</b>
        ${(team.swapBoxes||[]).length?`<span class="lbl">swaps</span><b>${esc(team.swapBoxes.join(' + '))}</b>`:''}
        <span id="fieldslot"></span></p>
      <p class="tag">${esc(team.tagline)}</p>
      <div class="pilot">${team.pilot.map(p=>`<div><dt>${esc(p.k)}</dt><dd>${p.v}</dd></div>`).join('')}</div>
      ${team.rigged?`<div class="teamrig"><span class="rlab">Engineered team</span><span>${team.rigged}</span></div>`:''}
      ${team.warn?`<p class="warnbar">${team.warn}</p>`:''}</div>
    </section>
    <section class="zone"><div class="zhead"><span class="znum">01</span><h2>Roster &amp; swaps</h2>
      <span class="zsub">click any swap card to put it in the slot — everything below recomputes</span></div>
      ${boostBanner()}
      <div class="roster">${slots}</div></section>
   </div>
   <section class="zone alt"><div class="wrap" style="padding:0">
     <div class="zhead"><span class="znum">02</span><h2>Combat reference</h2>
       <span class="zsub">for when you do not know what is coming</span></div>
     ${lookupPanel(mons)}
     ${calcPanel(mons)}
     <div style="display:flex;align-items:baseline;gap:14px;margin:22px 0 10px;flex-wrap:wrap">
       <h3 class="zsub" style="margin:0;font-weight:700;font-size:15px">Every type — the sprite is your best switch-in; open for the full ranking</h3>
       <button id="expall" type="button" class="minibtn">expand all</button></div>
     <div class="tgrid" id="tgrid">${tgrid}</div>
     <h3 class="zsub" style="margin:22px 0 10px;font-weight:700;font-size:15px">Full damage-taken matrix</h3>
     ${mat}
     ${(()=>{const used=[...new Set(mons.map(m=>m.ab)
        .filter(a=>a==='Wonder Guard'||ABS_IMMUNE[a]||ABS_HALVE[a]||ABS_FILTER.has(a)))];
       return used.length?`<p class="abkey">Cells marked <sup class="abmark">a</sup> are set by an
         <b>ability</b>, not by typing — hover for which. In play here:
         <b>${used.map(esc).join('</b>, <b>')}</b>.
         ${mons.some(m=>m.ab==='Wonder Guard')?' <b>Wonder Guard</b> zeroes everything that is not '
           +'super-effective, so most of that column is a genuine ×0.':''}</p>`:'';})()}

     <h3 class="zsub" style="margin:22px 0 10px;font-weight:700;font-size:15px">Turn order</h3>
     <div class="panel" style="margin-top:14px">
       ${mechBar(team)}
       <div class="speed" style="margin-top:12px">${spd.map((x,i)=>`${i?'<span class="arrow">›</span>':''}
         <span class="sp">${spr(x.m.name)}<span class="n">${esc(x.m.name)}</span>
         <span class="v">${x.s}${x.s!==x.base?` <span class="lbl">(${x.base})</span>`:''}</span></span>`).join('')}</div></div>

   </div></section>
   <div class="wrap">
    <section class="zone"><div class="zhead"><span class="znum">03</span><h2>Known opponents</h2>
      <span class="zsub">perfect information — pick a fight and test line-ups against it</span></div>
      <div class="panel" style="margin-bottom:14px">
        <h3 class="zsub" style="margin:0 0 4px;font-weight:700;font-size:15px">Level curve</h3>
        ${levelCurve(mons)}
      </div>
      ${battleIndex()}
      ${encounterPanel(mons,team)}
    </section>
    <section class="zone"><div class="zhead"><span class="znum">04</span><h2>Reference</h2>
      <span class="zsub">mechanics you only need occasionally</span></div>
      <details class="big"><summary>What this playthrough is gated on
        <span class="sub">— why some documented fights are not on this page</span></summary>
        <div class="bigbody"><div class="glos">${(D.GATES||[]).map(g=>
          `<div><dt>${esc(g[0])}</dt><dd>${g[1]}</dd></div>`).join('')}</div></div></details>
      <details class="big"><summary>Field effects
        <span class="sub">— weather, rooms, screens and hazards, and who of yours can set each</span></summary>
        <div class="bigbody">
          <p class="note" style="font-style:normal">Gen 5 values, and several are not what people
          remember: weather set by an <b>ability</b> is permanent here — Gen 6 put it on a five-turn
          clock. Every move and ability named below is checked against the ROM at build time.
          The toggles in <b>02 Combat reference</b> apply rain, sun, sand and Trick Room to every
          number on that tab.</p>
          <div class="glos">${(D.FIELD||[]).map(f=>`<div>
            <dt>${esc(f.name)} <span class="lbl">${esc(f.kind)}</span></dt>
            <dd>${f.text}
              <div class="fieldset">
                <span class="lbl">set by</span>
                ${f.setters.map(m=>`<span class="mvchip">${esc(m)}</span>`).join('')}
                ${f.abilities.map(a=>`<span class="mvchip ab">${esc(a)}</span>`).join('')}
              </div>
              <div class="fieldset">
                ${f.who.length
                  ? `<span class="lbl">yours</span>${f.who.map(n=>spr(n)).join('')}`
                  : '<span class="lbl">nobody you own can set this</span>'}
              </div>
            </dd></div>`).join('')}</div>
        </div></details>
      <details class="big"><summary>Status conditions <span class="sub">— what each actually does</span></summary>
        <div class="bigbody"><div class="glos">${STATUS.map(s=>`<div><dt>${s[0]}</dt><dd>${s[1]}</dd></div>`).join('')}</div></div></details>
      <details class="big"><summary>Where you are standing
        <span class="sub">— wild encounters in ${esc(HERE.loc||'?')}</span></summary>
        <div class="bigbody">
          ${HERE.rows&&HERE.rows.length?`
          <p class="note" style="font-style:normal">Straight from the encounter tables.
          ${HERE.hasSurf?'':'<b>No HM03</b>, so surf rows are unreachable and marked. '}
          ${HERE.hasRod?'You have the Fishing Rod, so fishing rows are live.':'<b>No rod</b>, so fishing rows are marked.'}</p>
          ${HERE.rows.map(r=>`<div class="encrow${r.gated?' gated':''}">
            <span class="lbl">${esc(r.method)}${r.gated?' · locked':''}</span>
            <div class="bteam">${r.mons.map(x=>{const n=SPNAME[x.id];
              return n?`<span class="encmon" title="${esc(n)} ${x.pct}%">${spr(n)}<i>${x.pct}%</i></span>`:'';}).join('')}</div>
          </div>`).join('')}`
          :'<p class="note">No encounter table matched this location.</p>'}
        </div></details>
      <details class="big"><summary>Your TMs
        <span class="sub">— and which of your six can learn each</span></summary>
        <div class="bigbody">
          <p class="note" style="font-style:normal">Compatibility is the ROM's own per-species TM list,
          so this is "can actually be taught", not a guess. The count on the right is how many of the
          ${BAGTM.length?BAGTM[0].owned:0} species you own could learn it.</p>
          <div class="rank">${BAGTM.map(t=>`<div class="rrow${t.party.length?'':' dim'}">
            <span class="rn">${esc(t.slot)}</span><span class="mvname">${esc(t.move)}</span>
            <span class="spacer"></span>
            ${t.party.length?t.party.map(n=>spr(n)).join(''):'<span class="lbl">none of your six</span>'}
            <span class="lbl">${t.n} owned</span></div>`).join('')}</div>
        </div></details>
      <details class="big"><summary>Find a Pokémon
        <span class="sub">— search all ${BOXED.length} in your party and boxes</span></summary>
        <div class="bigbody">
          <div class="navrow"><input id="boxq" placeholder="name, nickname, ability or type…"
            style="font:15px var(--sans);flex:1;min-width:220px;padding:10px 12px;border-radius:9px;
            border:1px solid var(--rule);background:var(--card-3);color:var(--ink)"></div>
          <div id="boxres" class="rank" style="margin-top:10px"></div>
        </div></details>
      <details class="big"><summary>Type chart <span class="sub">— the full Gen 5 table, attacker down the side</span></summary>
        <div class="bigbody">
          <p class="note" style="font-style:normal">Gen 5, so <b>Steel still resists Ghost and Dark</b> and
          Fairy does not exist. Blank cells are ×1.</p>
          <div class="matwrap"><table class="mat"><thead><tr><th></th>
            ${TYPES.map(t=>`<th>${ico(t)}<span class="hn">${t.slice(0,3)}</span></th>`).join('')}
          </tr></thead><tbody>
            ${TYPES.map(a=>`<tr><td class="tl">${ico(a)}${a}</td>${
              TYPES.map(d=>{const v=CHART[a][d];
                const cl=v===0?'m0':v===0.5?'m5':v===2?'m2':'m1';
                return `<td>${v===1?'<span style="color:var(--ink-faint)">·</span>'
                  :`<span class="mult ${cl}">${v===0?'0':v===0.5?'½':'2'}</span>`}</td>`;}).join('')
            }</tr>`).join('')}
          </tbody></table></div>
        </div></details>
    </section>
   </div>
   <datalist id="dexlist">${Object.keys(DEX).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;

  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    pick[tid][+b.dataset.s]=+b.dataset.o; save(); render(team);});
  const ni=document.getElementById('oppname');
  ni.oninput=()=>{const v=ni.value.trim(), d=DEX[v];
    if(d){look.a=d.t[0]; look.b=d.t[1]||''; look.name=v; render(team);}};
  document.getElementById('t1').onchange=e=>{look.a=e.target.value; look.name=''; render(team);};
  document.getElementById('t2').onchange=e=>{look.b=e.target.value; look.name=''; render(team);};
  document.getElementById('clr').onclick=()=>{look.a=look.b=look.name=''; render(team);};

  /* THE CALCULATOR. A full re-render per keystroke would be wrong here for the
     same reason it is wrong everywhere else -- it recreates the <input> and
     drops the caret -- so the defender name only redraws once it NAMES
     something, which is also when there is anything new to show. */
  const cd=document.getElementById('cDef');
  if(cd){
    cd.oninput=()=>{const v=cd.value.trim();
      calc.def=v;
      /* Changing species drops an ability the new one cannot have. Keeping it
         would quietly model a Garchomp with Regenerator, which is the sort of
         wrong answer that looks like a right one. The `all abilities` escape
         hatch is how you say you meant it. */
      const na=(DEX[v]&&DEX[v].a)||[];
      if(!calc.allAb&&calc.ab&&na.length&&na.indexOf(calc.ab)<0) calc.ab='';
      saveCalc();
      if(!v||DEX[v]) render(team);};
    document.getElementById('cAtk').onchange=e=>{calc.atk=e.target.value; saveCalc(); render(team);};
    document.getElementById('cAb').onchange=e=>{calc.ab=e.target.value; saveCalc(); render(team);};
    const ca=document.getElementById('cAll');
    if(ca) ca.onclick=()=>{calc.allAb=!calc.allAb; saveCalc(); render(team);};
    const cl=document.getElementById('cLvl');
    cl.onchange=()=>{calc.lvl=Math.max(1,Math.min(100,+cl.value||50)); saveCalc(); render(team);};
    document.getElementById('cClr').onclick=()=>{
      calc.def=''; calc.ab=''; calc.lvl=50; saveCalc(); render(team);};
  }
  // Click applies the move once more; clicking past its cap clears it, so a
  // control that only ever goes up is not a trap.
  document.querySelectorAll('[data-bmv]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.bmv.lastIndexOf('::');
    const k=b.dataset.bmv.slice(0,i), mv=b.dataset.bmv.slice(i+2);
    const a=bState[k]||(bState[k]={});
    const n=(a[mv]||0)+1;
    // The cap depends on the Pokemon, not just the move -- Simple halves it --
    // and this handler only has the key, so boostRow() puts it on the button.
    a[mv]=n>(+b.dataset.bmax||1)?0:n;
    render(team);});
  document.querySelectorAll('[data-bclr]').forEach(b=>b.onclick=()=>{
    if(b.dataset.bclr==='*') Object.keys(bState).forEach(k=>delete bState[k]);
    else delete bState[b.dataset.bclr];
    render(team);});
  document.querySelectorAll('[data-mech]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.mech; mechOn[k]=!mechOn[k]; render(team);});
  const es=document.getElementById('encsel');
  if(es) es.onchange=e=>{encIdx=+e.target.value; fieldE=[]; saveEnc(); render(team);};
  const step=d=>{encIdx=(encIdx+d+OPPONENTS.length)%OPPONENTS.length; fieldE=[]; saveEnc(); render(team);};
  document.querySelectorAll('[data-enc]').forEach(b=>b.onclick=()=>{
    encIdx=+b.dataset.enc; fieldE=[]; saveEnc(); render(team);
    const p=document.getElementById('encpanel');
    if(p) p.scrollIntoView({behavior:'smooth',block:'start'});});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const k=cKey(OPPONENTS[+b.dataset.done]); cleared[k]=!cleared[k]; saveProg(); render(team);});
  const ed=document.getElementById('encdone');
  if(ed) ed.onclick=()=>{const k=cKey(OPPONENTS[encIdx]); cleared[k]=!cleared[k]; saveProg(); render(team);};
  const en=document.getElementById('encnote');
  if(en) en.oninput=()=>{encNotes[encIdx]=en.value; saveProg();};
  document.querySelectorAll('[data-kf]').forEach(b=>b.onclick=()=>{
    encFilter=b.dataset.kf; saveEnc(); render(team);});
  const bq=document.getElementById('boxq'), br=document.getElementById('boxres');
  if(bq&&br){
    const draw=()=>{
      const q=bq.value.trim().toLowerCase();
      if(!q){br.innerHTML='<p class="note">Type to search.</p>';return;}
      const hits=BOXED.filter(x=>
        x.n.toLowerCase().includes(q)||String(x.k).toLowerCase().includes(q)||
        String(x.a).toLowerCase().includes(q)||(x.t||[]).some(t=>t.includes(q))).slice(0,60);
      br.innerHTML=hits.length?hits.map(x=>`<div class="rrow">${spr(x.n)}
        <span class="rn">${esc(x.n)}</span>
        <span class="mvname">${esc(x.k&&x.k!==x.n.toUpperCase()?x.k:'')}</span>
        <span class="lbl">${esc(x.a||'')}</span>
        <span class="spacer"></span>
        <span class="lbl">L${x.l}</span><span class="mult m1">${esc(x.b)}</span></div>`).join('')
        :'<p class="note">Nothing matches.</p>';
    };
    bq.oninput=draw; draw();
  }
  const bw=document.getElementById('bidxwrap');
  if(bw) bw.ontoggle=()=>{encIdxOpen=bw.open; saveEnc();};
  const pv=document.getElementById('encprev'), nx=document.getElementById('encnext');
  if(pv) pv.onclick=()=>step(-1);
  if(nx) nx.onclick=()=>step(1);
  document.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{
    gDepth=parseInt(b.dataset.gd,10)||2;
    try{localStorage.setItem('bb_gdepth',String(gDepth));}catch(e){}
    render(team);});
  document.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{
    fmt=b.dataset.fmt; fieldE=fieldE.slice(0,fmt==='doubles'?2:1);
    fieldM=fieldM.slice(0,fmt==='doubles'?2:1); render(team);});
  /* Switching pairing is a redraw, like every other control on this panel. */
  document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{
    pairIdx=+b.dataset.pair; render(team);});
  const toggleField=(arr,val)=>{const cap=fmt==='doubles'?2:1;
    const i=arr.indexOf(val);
    if(i>=0) arr.splice(i,1); else {arr.push(val); while(arr.length>cap) arr.shift();}};
  document.querySelectorAll('[data-fe]').forEach(b=>b.onclick=()=>{
    toggleField(fieldE,b.dataset.fe); render(team);});
  document.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{
    toggleField(fieldM,b.dataset.fm); render(team);});
  document.querySelectorAll('[data-bench]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.bench; benched[n]=!benched[n]; render(team);});
  const ea=document.getElementById('expall');
  if(ea) ea.onclick=()=>{const g=document.getElementById('tgrid');
    const anyClosed=[...g.querySelectorAll('details')].some(d=>!d.open);
    g.querySelectorAll('details').forEach(d=>d.open=anyClosed);
    ea.textContent=anyClosed?'collapse all':'expand all';};
  wireTips();
}

function wireTips(){}   // tooltips are pure CSS now — nothing to wire

const tabs=document.getElementById('tabs');

// Tab order is user-controlled: picking a team moves it to the front and the
// order persists, so the roster you are actually running is always first.
let tabOrder=[];
try{const o=JSON.parse(localStorage.getItem('bb_taborder')||'[]');
  if(Array.isArray(o)) tabOrder=o.filter(x=>typeof x==='string');}catch(e){}

function orderedTeams(){
  const byId=Object.fromEntries(TEAMS.map(t=>[t.id,t]));
  const seen=new Set(), out=[];
  tabOrder.forEach(id=>{if(byId[id]&&!seen.has(id)){out.push(byId[id]);seen.add(id);}});
  TEAMS.forEach(t=>{if(!seen.has(t.id)){out.push(t);seen.add(t.id);}});
  return out;
}

function buildTabs(activeId){
  tabs.innerHTML='';
  orderedTeams().forEach(t=>{
    const b=document.createElement('button');
    b.type='button'; b.setAttribute('role','tab');
    b.innerHTML=`${esc(t.name)}`
      +`<span class="loc st-${esc(t.state||'')}">${esc(t.where)}</span>`;
    b.setAttribute('aria-selected', t.id===activeId?'true':'false');
    b.onclick=()=>{
      tabOrder=[t.id, ...orderedTeams().map(x=>x.id).filter(i=>i!==t.id)];
      try{localStorage.setItem('bb_taborder',JSON.stringify(tabOrder));}catch(e){}
      buildTabs(t.id); render(t);
      tabs.scrollIntoView({behavior:'smooth',block:'nearest'});
    };
    tabs.appendChild(b);
  });
}

const first=orderedTeams()[0];
// NO TEAMS IS A REAL STATE, NOT A CRASH. Teams come from the team store now,
// and a fresh checkout has none -- this used to read `first.id` and take the
// whole page down with it, encounter data and all. Everything below the
// roster works without a team, so the roster says what to do and the rest of
// the page carries on.
if(first){ buildTabs(first.id); render(first); }
else {
  // Written into the tab strip itself rather than beside it: that is where a
  // team would have been, and it needs no parent node -- which the stubbed DOM
  // the verifier runs this under does not have.
  tabs.removeAttribute('role');
  tabs.innerHTML='<p class="noteams"><b>No teams yet.</b> Build one in the '
    +'<b>Team Builder</b> and save it as a core — it shows up here as a tab, with '
    +'damage numbers, speed order and matchup planning against every documented '
    +'fight. The reference and opponent sections below work without one.</p>';
}
</script>
