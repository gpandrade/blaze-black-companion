<title>Kaiju, Rain, Trick Room, Edgelord, Mewtwo</title>
<style>
  :root{
    --ground:#F5EDF3; --card:#FFFCFE; --card-2:#F1E9EF; --card-3:#FEF7FB; --zone:#EFE7ED;
    --ink:#1A1519; --ink-soft:#5B4F58; --ink-faint:#7A6B76;
    --rule:#E1D8DE; --rule-soft:#EEE6EC;
    --ember:#B8410F; --ember-soft:#FBE8DE;
    --setter:#3B3897; --setter-bg:#E5E4F7; --sweep:#A8360F; --sweep-bg:#FAE3D7;
    --wall:#0A6152; --wall-bg:#D6EDE8; --pivot:#774E04; --pivot-bg:#F7EBCF;
    --x0:#157054;--x0b:#D2ECE2; --x25:#27835A;--x25b:#DAEFE2; --x5:#537F42;--x5b:#E2EFD6;
    --x1:#8B7C87;--x1b:#F3EBF1; --x2:#B84F14;--x2b:#FAE2D2; --x4:#98181A;--x4b:#F8D8D8;
    --bar:#B8410F; --bartrack:#E9E1E7;
    --shadow:0 1px 1px rgba(16,23,32,.06),0 2px 5px rgba(16,23,32,.05),0 10px 26px rgba(16,23,32,.06);
    --rim:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(16,23,32,.05);
    /* Two-series categorical pair. Stepped separately per mode and validated
       with the dataviz six-checks against each mode's card surface:
       light #B8410F/#5B57C4 on #FFF, dark #E0632B/#7B78D8 on #161D27.
       Worst adjacent CVD separation 24.8 (protan), normal-vision 27.1. */
    --s1:#B8410F; --s2:#5B57C4; --grid:#EEE6EC; --axis:#8B7C87;
    --on-ember:#FFFFFF; --on-x4:#FFFFFF; --on-series:#FFFFFF;
    --nat-up:#C2410C; --nat-down:#1D4ED8;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0D061A; --card:#27233B; --card-2:#36314D; --card-3:#1A172A; --zone:#130F20;
    --ink:#F0EBFF; --ink-soft:#BCB4D9; --ink-faint:#988FBC;
    --rule:#3F3A59; --rule-soft:#2D2942; --ember:#FF8552; --ember-soft:#3A1C10;
    --setter:#A6A3F5;--setter-bg:#211F3A; --sweep:#FF9466;--sweep-bg:#331B10;
    --wall:#5FD3BC;--wall-bg:#0F2E29; --pivot:#E9B563;--pivot-bg:#2E2414;
    --x0:#5FDDB2;--x0b:#0F2F26; --x25:#6BD29C;--x25b:#132D21; --x5:#9BCB78;--x5b:#1E2B19;
    --x1:#988FBC;--x1b:#2F2B45; --x2:#FF8B52;--x2b:#331B10; --x4:#FF6B68;--x4b:#3A1717;
    --bar:#FF8552; --bartrack:#3B3553;
    --shadow:0 1px 2px rgba(0,0,0,.62),0 4px 11px rgba(0,0,0,.45),0 16px 38px rgba(0,0,0,.34);
    --rim:inset 0 1px 0 rgba(190,222,255,.07),inset 0 -1px 0 rgba(0,0,0,.34);
    --s1:#E0632B; --s2:#8A87E0; --grid:#332E49; --axis:#988FBC;
    --on-ember:#2A1206; --on-x4:#2E0B0A; --on-series:#0B0A18;
    --nat-up:#FF9466; --nat-down:#7FB4FF;
  }}
  :root[data-theme="dark"]{
    --ground:#0D061A; --card:#27233B; --card-2:#36314D; --card-3:#1A172A; --zone:#130F20;
    --ink:#F0EBFF; --ink-soft:#BCB4D9; --ink-faint:#988FBC;
    --rule:#3F3A59; --rule-soft:#2D2942; --ember:#FF8552; --ember-soft:#3A1C10;
    --setter:#A6A3F5;--setter-bg:#211F3A; --sweep:#FF9466;--sweep-bg:#331B10;
    --wall:#5FD3BC;--wall-bg:#0F2E29; --pivot:#E9B563;--pivot-bg:#2E2414;
    --x0:#5FDDB2;--x0b:#0F2F26; --x25:#6BD29C;--x25b:#132D21; --x5:#9BCB78;--x5b:#1E2B19;
    --x1:#988FBC;--x1b:#2F2B45; --x2:#FF8B52;--x2b:#331B10; --x4:#FF6B68;--x4b:#3A1717;
    --bar:#FF8552; --bartrack:#3B3553;
    --shadow:0 1px 2px rgba(0,0,0,.62),0 4px 11px rgba(0,0,0,.45),0 16px 38px rgba(0,0,0,.34);
    --rim:inset 0 1px 0 rgba(190,222,255,.07),inset 0 -1px 0 rgba(0,0,0,.34);
    --s1:#E0632B; --s2:#8A87E0; --grid:#332E49; --axis:#988FBC;
    --on-ember:#2A1206; --on-x4:#2E0B0A; --on-series:#0B0A18;
    --nat-up:#FF9466; --nat-down:#7FB4FF;
  }
  *{box-sizing:border-box;}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;
    line-height:1.5;margin:0;padding:0 0 90px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px;}
  img{image-rendering:pixelated;}

  header.mast{padding:32px 0 18px;}
  h1{font-size:clamp(28px,4vw,42px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0;}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ember);margin:0 0 8px;}
  .built{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin:8px 0 0;}

  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 20px;}
  nav.tabs button{font:700 16px var(--sans);color:var(--ink-soft);background:var(--card);
    border:1px solid var(--rule);border-radius:10px;padding:11px 18px;cursor:pointer;
    display:flex;align-items:baseline;gap:9px;box-shadow:var(--shadow);}
  nav.tabs button:hover{background:var(--card-2);}
  nav.tabs button[aria-selected="true"]{background:var(--ember);border-color:var(--ember);color:var(--on-ember);}
  nav.tabs button:focus-visible{outline:3px solid var(--ember);outline-offset:2px;}
  nav.tabs .loc{font-family:var(--mono);font-size:11.5px;opacity:.85;}
  /* the team's one-letter box tag, which is how it is found in the PC */
  /* status colour: fielded reads as live, stored as parked */
  nav.tabs .loc.st-fielded{color:var(--x0);font-weight:700;}
  nav.tabs .loc.st-partial{color:var(--x2);font-weight:700;}
  nav.tabs button[aria-selected="true"] .loc{color:var(--on-ember);}

  /* ---- big zoned sections ---- */
  section.zone{padding:30px 0 34px;border-top:3px solid var(--ink);margin-top:30px;}
  section.zone.alt{background:var(--zone);border-top-color:var(--ember);
    margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:24px;padding-right:24px;}
  section.zone.alt > *{max-width:1400px;margin-left:auto;margin-right:auto;}
  .zhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 20px;}
  .zhead h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .zhead .zsub{color:var(--ink-faint);font-size:14.5px;}
  .znum{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--on-ember);background:var(--ember);
    border-radius:6px;padding:4px 9px;letter-spacing:.06em;}

  .panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;
    box-shadow:var(--shadow);padding:18px 20px;}
  .strip h3{margin:0 0 5px;font-size:22px;font-weight:750;letter-spacing:-.02em;}
  .strip .tag{margin:0;color:var(--ink-soft);font-size:15px;max-width:90ch;}
  .whereline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px;font-size:13.5px;}
  .whereline b{font-family:var(--mono);font-size:12.5px;color:var(--ink);}
  .whereline b.st-fielded{color:var(--x0);} .whereline b.st-partial{color:var(--x2);}
  .pilot{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px;}
  .pilot div{background:var(--card-3);border:1px solid var(--rule-soft);border-radius:9px;padding:12px 14px;}
  .pilot dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ember);margin:0 0 4px;}
  .pilot dd{margin:0;font-size:14px;color:var(--ink-soft);}
  .warnbar{margin:16px 0 0;padding:12px 15px;background:var(--ember-soft);border-radius:9px;
    font-size:14.5px;color:var(--ink-soft);border-left:4px solid var(--ember);} .warnbar b{color:var(--ink);}

  /* ---- roster ---- */
  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(438px,1fr));gap:18px;align-items:start;}
  .slot{display:flex;flex-direction:column;}
  /* Its own containment context: the card's width comes from the roster grid,
     not the viewport, so a media query cannot see it. */
  .card{background:var(--card);border:1px solid var(--rule);border-radius:12px;
    box-shadow:var(--shadow);container-type:inline-size;}
  .card .top{display:flex;align-items:center;gap:12px;padding:11px 15px;background:var(--card-2);
    border-bottom:1px solid var(--rule);border-radius:11px 11px 0 0;}
  .num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-faint);letter-spacing:.08em;}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 9px;border-radius:5px;margin-left:auto;}
  .chip.setter{color:var(--setter);background:var(--setter-bg);}
  .chip.sweeper{color:var(--sweep);background:var(--sweep-bg);}
  .chip.wall{color:var(--wall);background:var(--wall-bg);}
  .chip.pivot{color:var(--pivot);background:var(--pivot-bg);}
  .idbar{display:flex;align-items:center;column-gap:15px;row-gap:9px;
    padding:15px 15px 8px;flex-wrap:wrap;}
  .idbar img.sp{width:96px;height:96px;flex:none;}
  .idbar .nm{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .idbar .shiny{color:var(--ember);font-size:15px;}
  .tline{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap;}
  .tline img{height:20px;width:auto;}
  .meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .meta b{color:var(--ink);font-weight:700;}
.tip{position:relative;border-bottom:1px dotted var(--ember);cursor:help;}
  .tip>.tipbox{position:absolute;left:0;top:calc(100% + 7px);z-index:60;width:290px;
    background:var(--card);color:var(--ink);border:2px solid var(--ember);border-radius:10px;
    padding:10px 13px;font-family:var(--sans);font-size:13.5px;line-height:1.5;font-weight:400;
    box-shadow:0 10px 30px rgba(0,0,0,.28);visibility:hidden;opacity:0;text-transform:none;
    letter-spacing:normal;pointer-events:none;}
  .tip>.tipbox b{display:block;color:var(--ember);font-family:var(--mono);font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
  .tip:hover>.tipbox,.tip:focus>.tipbox,.tip:focus-within>.tipbox{visibility:visible;opacity:1;}
  .tip:last-child>.tipbox{left:auto;right:0;}

  .bars{padding:6px 15px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;}
  .bars .bn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);}
  /* The nature's +/-10%, marked on the stat name the way the game marks it
     on the summary screen. No legend: anyone reading this knows. */
  .bars .bn.nat-up{color:var(--nat-up);font-weight:700;}
  .bars .bn.nat-down{color:var(--nat-down);font-weight:700;}
  .bars .bt{display:block;height:11px;background:var(--bartrack);border-radius:6px;overflow:hidden;}
  .bars .bf{display:block;height:11px;background:var(--bar);border-radius:6px;}
.bars .bv{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
  /* THE DIVIDER IS ITS OWN GRID ROW, not padding on three cells.
     It used to be `margin-top:4px;padding-top:5px;border-top:1px` on .tot,
     which applied to all three cells -- and `.bt` has a FIXED 11px height
     under `box-sizing:border-box`, so the border and padding ate 6 of its 11
     pixels. The track still painted its full 11px pill while the fill was
     clipped to the bottom 5px, i.e. the bar sat below its own colouring.
     It also never drew a continuous line: with `align-items:center` the three
     cells are different heights, so each border landed at a different y. */
  .bars .totrule{grid-column:1/-1;height:1px;background:var(--rule);}
  .bars .bn.tot{color:var(--ember);font-weight:700;}
  .bars .bv.tot{color:var(--ember);font-size:14px;}
  .bars .bt.tot .bf{background:var(--ember);opacity:.85;}

  .movelist{padding:0 15px 12px;display:flex;flex-direction:column;gap:5px;}
  details.mv{border:1px solid var(--rule-soft);border-radius:8px;background:var(--card-3);}
  details.mv summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:14.5px;}
  details.mv summary::-webkit-details-marker{display:none;}
  details.mv summary::after{content:"▾";margin-left:auto;font-size:11px;color:var(--ink-faint);}
  details.mv[open] summary::after{content:"▴";}
  details.mv summary:hover{background:var(--card-2);}
  details.mv summary img{height:17px;width:auto;flex:none;}
  details.mv summary .mn{font-weight:650;}
  details.mv summary .pw{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
  .mvbody{padding:4px 12px 11px;border-top:1px dashed var(--rule);}
  .mvstat{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.05em;
    text-transform:uppercase;margin:8px 0 7px;}
  .flag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;padding:3px 8px;border-radius:5px;margin:0 5px 5px 0;}
  .f-ail{color:var(--x2);background:var(--x2b);} .f-stat{color:var(--pivot);background:var(--pivot-bg);}
  .f-pri{color:var(--setter);background:var(--setter-bg);}
  .mvnote{font-size:14px;color:var(--ink-soft);margin:3px 0 0;} .mvnote b{color:var(--ink);}
  .mvplain{font-size:14px;color:var(--ink-faint);margin:3px 0 0;font-style:italic;}
  .why{margin:0;padding:0 15px 14px;font-size:14px;color:var(--ink-soft);}

  .branch{margin-left:18px;padding-left:20px;border-left:3px solid var(--rule);padding-top:10px;
    display:flex;flex-direction:column;gap:9px;}
  .branch .bl{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 2px;}
  .opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--card-3);border:1px solid var(--rule);border-radius:10px;padding:9px 12px;
    cursor:pointer;font:inherit;color:inherit;}
  .opt::before{content:"";position:absolute;left:-22px;top:50%;width:20px;height:3px;background:var(--rule);}
  .opt:hover{background:var(--card-2);border-color:var(--ember);}
  .opt:focus-visible{outline:3px solid var(--ember);outline-offset:2px;}
  .opt[aria-current="true"]{border-color:var(--ember);background:var(--ember-soft);border-width:2px;}
  .opt img.sp{width:60px;height:60px;flex:none;}
  .opt .on{font-size:17px;font-weight:750;} .opt .od{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
  .opt .badge{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ember);}
  .optnote{font-size:13.5px;color:var(--ink-soft);margin:-2px 0 2px 72px;} .optnote b{color:var(--ink);}
  /* Deliberately-broken Pokemon: an ability or moveset written into the save
     that the species cannot legally have.  Uses the setter token so it reads
     as a distinct, non-alarming aside in both themes. */
  /* Team-scale version of .rigged: the whole roster is engineered, not one slot. */
  .teamrig{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:12px 15px;
    background:var(--setter-bg);border-left:4px solid var(--setter);border-radius:0 9px 9px 0;
    font-size:14.5px;line-height:1.55;color:var(--ink-soft);}
  .teamrig b{color:var(--ink);}
  .teamrig .rlab{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--setter);flex:none;padding-top:3px;white-space:nowrap;}
  /* Shown in place of the roster when the team store is empty -- a fresh
     checkout, or someone who has retired everything. */
  .noteams{margin:0 0 6px;padding:14px 16px;border:1px dashed var(--rule);border-radius:10px;
    background:var(--card-3);font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
  .noteams b{color:var(--ink);font-weight:700;}
  .rigged{display:flex;gap:10px;align-items:flex-start;margin:2px 0 4px 72px;padding:8px 12px;
    background:var(--setter-bg);border-left:3px solid var(--setter);border-radius:0 8px 8px 0;
    font-size:13px;line-height:1.5;color:var(--ink-soft);}
  .rigged b{color:var(--ink);font-weight:700;}
  .rigged .rlab{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;color:var(--setter);flex:none;padding-top:3px;}
  .delta{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 8px;
    border-radius:5px;margin:4px 0 0 72px;}
  .d-good{color:var(--x0);background:var(--x0b);} .d-bad{color:var(--x4);background:var(--x4b);}
  .d-same{color:var(--x1);background:var(--x1b);}

  /* ---- lookup / ranking ---- */
  .lookup{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld label{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);}
  .fld input,.fld select{font:15px var(--sans);color:var(--ink);background:var(--card-3);
    border:1px solid var(--rule);border-radius:9px;padding:10px 12px;min-width:190px;}
  .fld input:focus,.fld select:focus{outline:3px solid var(--ember);outline-offset:1px;}
  /* The ability field carries a second control -- "all abilities" -- and .fld
     stacks its children, which would put a button under the select and break
     the row's baseline. The select and its escape hatch sit side by side. */
  .fld.abfld{flex-direction:row;flex-wrap:wrap;align-items:center;gap:7px;}
  .fld.abfld label{flex:0 0 100%;}
  .lookup button.aball{font:700 11.5px var(--sans);padding:8px 11px;border-radius:8px;}
.minibtn{font:700 12.5px var(--sans);background:var(--card-2);color:var(--ink-soft);
    border:1px solid var(--rule);border-radius:7px;padding:6px 11px;cursor:pointer;}
  .minibtn:hover{border-color:var(--ember);}
  .lookup button{font:700 14px var(--sans);background:var(--card-2);color:var(--ink-soft);
    border:1px solid var(--rule);border-radius:9px;padding:11px 16px;cursor:pointer;}
  .lookup button:hover{border-color:var(--ember);}
  .oppline{margin:16px 0 0;display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:16px;}
  .oppline img.big{width:76px;height:76px;}
  .rank{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .rrow{display:flex;align-items:center;gap:12px;background:var(--card-3);border:1px solid var(--rule-soft);
    border-radius:10px;padding:8px 13px;flex-wrap:wrap;}
  .rrow.best{border-color:var(--ember);border-width:2px;background:var(--ember-soft);}
  .rrow img{width:52px;height:52px;flex:none;}
  .rrow .rn{font-weight:750;font-size:16.5px;min-width:120px;}
  .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);}
  .rrow .mvname{font-size:13.5px;color:var(--ink-soft);}
  .spacer{margin-left:auto;}

  .speed{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .sp{display:flex;align-items:center;gap:9px;background:var(--card-3);border:1px solid var(--rule-soft);
    border-radius:10px;padding:7px 12px;}
  .sp img{width:46px;height:46px;} .sp .v{font-family:var(--mono);font-size:14px;font-weight:700;}
  .sp .n{font-size:14.5px;font-weight:600;}
  .arrow{color:var(--ink-faint);font-size:16px;}
  .toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-soft);cursor:pointer;font-weight:600;}
  .toggle input{width:19px;height:19px;accent-color:var(--ember);cursor:pointer;}

  /* ---- unified type matchup ---- */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start;}
  details.tcard{background:var(--card);border:1px solid var(--rule);border-radius:11px;box-shadow:var(--shadow);}
  details.tcard>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px;padding:12px 14px;}
  details.tcard>summary::-webkit-details-marker{display:none;}
  details.tcard>summary::after{content:"▾";margin-left:6px;color:var(--ink-faint);}
  details.tcard[open]>summary::after{content:"▴";}
  details.tcard>summary:hover{background:var(--card-2);border-radius:11px;}
  .tcard .ico{height:22px;width:auto;}

  /* SIX COLUMNS, ALWAYS. A wrapping flex row left every card's team hugging

  /* ============ added panels ============ */

  .subhead{font-size:17px;font-weight:750;color:var(--ink);letter-spacing:-.01em;
    margin:22px 0 0;padding:14px 16px 0;background:var(--card-3);

  /* Six columns x three rows, parked to the right of the name WHEN IT FITS.
     The roster is auto-fill minmax(390px), so the narrowest column leaves only
     60px beside a 96px sprite and this 174px grid -- not enough for a 24px
     name or for two 60px type icons, both of which used to overflow across
     the grid. .idbar wraps and .idtext carries a real flex-basis, so below
     about a 486px card the grid drops to its own row instead of colliding.
     It keeps its fixed width there rather than stretching, because the whole
     point of a same-shape grid is being able to pattern-match it across the
     roster. */
  .idbar .idtext{flex:1 1 126px;min-width:0;}
  /* Vertically centred with the sprite and name -- .idbar is align-items:center

  .tcov{display:grid;grid-template-columns:repeat(6,1fr);gap:2.5px;

  @container (max-width:429px){

  @media (max-width:520px){.tcov b{font-size:6.5px;} .tcov b i{font-size:8.5px;}}

  /* Wider than it was. The card carries both halves of an exchange now, and at

/* THE SCALE IS THE FIRST THING TO READ, so it is a strip of the actual cell

.gpair{margin-top:2px}

<script>

// Portraits arrived after the app started hosting this template, so an
// older blob simply has no TRFACE. Defaulting keeps the battle tab alive
// instead of throwing on the first encounter card.
const TRFACE=D.TRFACE||{};

const MECH={
  rain:{label:'Rain',       atk:{water:1.5,fire:0.5}, spd:{'Swift Swim':2},
        hint:'Water ×1.5, Fire ×0.5, Thunder never misses'},
  sun: {label:'Harsh sun',  atk:{fire:1.5,water:0.5}, spd:{'Chlorophyll':2},
        hint:'Fire ×1.5, Water ×0.5, SolarBeam skips its charge'},
  sand:{label:'Sandstorm',  atk:{},                   spd:{'Sand Rush':2},

  tr:  {label:'Trick Room', atk:{},                   spd:{}, invert:true,
        hint:'Speed order inverted for five turns'}};
const mechOn={};
const atkMul=ty=>Object.keys(mechOn).reduce((a,k)=>mechOn[k]&&MECH[k].atk[ty]?a*MECH[k].atk[ty]:a,1);
// ---------------------------------------------------------------------------
// EFFECTIVE STATS.  The save stores raw stats; several of the abilities on
// these teams multiply them, and the sheet used to ignore that entirely -- a
// Huge Power Snorlax displayed 70 Attack while functionally having 140.
// Weather-gated entries only apply while that toggle is on.
// ---------------------------------------------------------------------------
const SIDX={hp:0,atk:1,def:2,spa:3,spd:4,spe:5};

/* NATURE MARKS. Gen 5 packs the effect into the nature's INDEX: id/5 is the
   stat raised and id%5 the one lowered, over [atk, def, spe, spa, spd] --
   speed THIRD, which is the save's stat order and not the order stats print
   in. The blob carries the nature by name, so the name list has to stay in
   the same order as js/tables.js; the five where both land on one stat
   (Hardy, Docile, Serious, Bashful, Quirky) are the neutral ones. */
const NATNAMES=['Hardy','Lonely','Brave','Adamant','Naughty',
  'Bold','Docile','Relaxed','Impish','Lax',
  'Timid','Hasty','Serious','Jolly','Naive',
  'Modest','Mild','Quiet','Bashful','Rash',
  'Calm','Gentle','Sassy','Careful','Quirky'];
const NATORD=['atk','def','spe','spa','spd'];
const natEffect=n=>{
  const i=NATNAMES.indexOf(n);
  if(i<0) return null;
  const u=Math.floor(i/5), d=i%5;
  return u===d?null:{up:NATORD[u],down:NATORD[d]};
};
const STAT_ABIL={
  'Huge Power':{atk:2}, 'Pure Power':{atk:2},
  'Solar Power':{spa:1.5,mech:'sun'},
  'Flower Gift':{atk:1.5,spd:1.5,mech:'sun'},
  'Slow Start':{atk:0.5,spe:0.5},
  'Defeatist':{atk:0.5,spa:0.5},
  'Marvel Scale':{def:1.5,status:true},
  'Guts':{atk:1.5,status:true}};
// ---------------------------------------------------------------------------
// STAT STAGES.  A what-if layer: "what does Snorlax hit for AFTER Belly Drum".
//
// Deliberately NOT persisted.  A boost is a hypothetical about one turn, not a
// preference -- coming back tomorrow to a sheet quietly reporting +6 Attack
// numbers would be a lie the page told itself overnight.  Reload clears it.
//
// Which moves boost what comes from the ROM (MOVES[].st / .tg), so a stat move
// this hack rebalanced is reflected without anyone editing a list here.
// ---------------------------------------------------------------------------
const BOOSTCAP=6;
const stageMul=n=>n>=0?(2+n)/2:2/(2-n);
const bKey=m=>`${m.name}|${m.box}`;
const bState={};                      // monKey -> {moveName: times applied}

// CONTRARY AND SIMPLE REWRITE THE MOVE, so they have to be applied where the
// stage deltas are read and not anywhere downstream.
//
// This was a real wrong answer, not a missing nicety.  A Contrary Arcanine
// with V-create (ROM: Spe -1, Def -1) was having the drop applied literally,
// so two clicks put it at 0.5x speed and three at 0.4x -- which is why the
// turn order flipped from "you first" to "them first" as the boost was
// stacked UP.  With Contrary the move raises those stats, so more clicks can
// only ever make it faster.  The sheet knew about the ability -- statNote()
// said so in prose -- and then ignored it in every number on the page.
//
// Only the SELF side is touched.  Contrary inverts what happens to its own
// holder; a foe-targeting drop we inflict is unaffected by our ability.
const selfDelta=(mon,d)=>{
  const sign=mon.ab==='Contrary'?-1:1, scale=mon.ab==='Simple'?2:1;
  const out={};
  for(const k in d.st) out[k]=d.st[k]*sign*scale;
  return out;
};
const stageFx=(mon,d)=>(d.tg==='foe'?d.st:selfDelta(mon,d));
// How many times a move can stack before it hits the +-6 ceiling.  Belly Drum
// gets one click, Dragon Dance six -- and Simple halves both, because it is
// the doubled delta that has to fit under the cap.
const bMax=(d,mon)=>Math.max(1,Math.ceil(
  BOOSTCAP/Math.max(...Object.values(stageFx(mon,d)).map(Math.abs))));
function stagesOf(mon){
  const out={self:{},foe:{}}, act=bState[bKey(mon)]||{};
  for(const mv in act){
    const d=MOVES[mv], n=act[mv];
    if(!d||!d.st||!n) continue;
    const side=d.tg==='foe'?'foe':'self';
    const st=stageFx(mon,d);
    for(const k in st)

  }
  return out;
}
const anyBoost=()=>Object.values(bState).some(a=>Object.values(a).some(n=>n>0));
// Every stat-changing move this mon actually knows.  No move, no button.
const boostMoves=m=>(m.moves||[]).filter(n=>MOVES[n]&&MOVES[n].st&&Object.keys(MOVES[n].st).length);

// THE ABILITY AND WEATHER HALF, on its own, so BOTH SIDES get it.
//
// This used to live only inside statMul(), which is your side. The opponent's
// defence was read straight off their base stats and their Speed straight off
// theirs, so a Marvel Scale wall took full damage and a Swift Swim sweeper was
// listed as slower than you in the rain. This tab exists to say how YOUR team
// does against THEM, which it cannot do while their abilities are ignored.
//
// Stat stages are deliberately NOT in here: those are the what-if layer, and
// they belong to your side only.
function abilMul(mon,key){
  let m=1;
  const a=STAT_ABIL[mon&&mon.ab];
  // `status:true` entries need a status condition we do not model, so they are
  // reported in the notes rather than silently baked into the number.
  if(a&&a[key]&&!a.status&&(!a.mech||mechOn[a.mech])) m*=a[key];
  if(key==='spe') Object.keys(mechOn).forEach(k=>{
    if(mechOn[k]&&MECH[k].spd[mon&&mon.ab]) m*=MECH[k].spd[mon.ab];});
  return m;
}
function statMul(mon,key){
  let m=abilMul(mon,key);
  const st=stagesOf(mon).self[key];
  if(st) m*=stageMul(st);
  return m;
}
const statOf=(mon,key)=>Math.floor((mon.stats?mon.stats[SIDX[key]]:0)*statMul(mon,key));
const spdOf=m=>statOf(m,'spe');
// ---------------------------------------------------------------------------
// DAMAGE.  Gen 5 formula, with the opponent's stats built from their real
// level and species base stats at 31 IVs / 0 EVs / neutral nature -- Drayano
// documents natures for some trainers but the parser does not capture them, so
// neutral is the stated assumption rather than a hidden one.
// ---------------------------------------------------------------------------
const ITEM_MUL={'Life Orb':{all:1.3},'Choice Band':{phys:1.5},'Choice Specs':{spec:1.5},
                'Muscle Band':{phys:1.1},'Wise Glasses':{spec:1.1},'Expert Belt':{se:1.2}};
function calcDamage(me,mvName,om){
  const md=MOVES[mvName]; if(!md||md.c==='status') return null;
  if(!md.p||md.p<=1||!om||!om.b) return null;          // variable-power moves
  const phys=md.c==='physical';
  const lvl=me.lvl||50, dlv=om.lvl||50, b=om.b;
  const A=statOf(me,phys?'atk':'spa');
  const fstg=stagesOf(me).foe[phys?'def':'spd']||0;
  // The defender's own ability counts too -- see abilMul. Their nature, IVs and
  // EVs remain the stated assumption (neutral / 31 / 0); the ability is not an
  // assumption, it is in the roster.
  const D=Math.max(1,Math.floor((Math.floor((2*b[phys?2:4]+31)*dlv/100)+5)
    *stageMul(fstg)*abilMul(om,phys?'def':'spd')));
  const hp=Math.floor((2*b[0]+31)*dlv/100)+dlv+10;
  const e=eff(md.t,om);
  if(e===0) return {e:0,hp,lo:0,hi:0,pctLo:0,pctHi:0,ko:null};
  let m=e*atkMul(md.t);
  m*= (me.types||[]).includes(md.t) ? (me.ab==='Adaptability'?2:1.5) : 1;
  const im=ITEM_MUL[me.item]||{};
  if(im.all) m*=im.all;
  if(im.phys&&phys) m*=im.phys;
  if(im.spec&&!phys) m*=im.spec;
  if(im.se&&e>1) m*=im.se;
  const base=Math.floor(Math.floor(Math.floor(2*lvl/5+2)*md.p*A/D)/50)+2;
  const lo=Math.max(1,Math.floor(base*m*0.85)), hi=Math.max(1,Math.floor(base*m));
  const pctLo=lo/hp*100, pctHi=hi/hp*100;
  const koMax=Math.ceil(hp/lo), koMin=Math.ceil(hp/hi);
  return {e,hp,lo,hi,pctLo,pctHi,ko:koMin===koMax?`${koMin}HKO`:`${koMin}–${koMax}HKO`};
}
// Draws the low..high damage range against the target's HP.  Overkill is
// clamped to the track and labelled, so a 240% hit does not silently look the
// same as a 100% one.
function hpBar(d){
  if(!d) return '';
  if(d.e===0) return '<span class="hpbar"><span class="over" style="color:var(--ink-faint)">immune</span></span>';
  const lo=Math.min(100,d.pctLo), hi=Math.min(100,d.pctHi);
  const cls=d.pctLo>=100?'kill':d.pctHi<35?'chip':'';
  return `<span class="hpbar ${cls}" title="${d.lo}–${d.hi} of ${d.hp} HP">
    <i class="hi" style="width:${hi}%"></i><i class="lo" style="width:${lo}%"></i>
    ${d.pctLo>=100?`<span class="over">×${(d.pctLo/100).toFixed(1)} over</span>`:''}</span>`;
}
const dmgTxt=d=>!d?'':d.e===0?'immune'
  :`${d.pctLo.toFixed(0)}–${d.pctHi.toFixed(0)}%`;

// A conditional boost the sheet deliberately does not apply, so it can say so.
function statNote(mon){
  const a=STAT_ABIL[mon.ab];
  if(a&&a.status) return `${mon.ab} adds ×${a.atk||a.def} once it is statused — not counted here`;
  if(mon.ab==='Speed Boost') return 'Speed Boost adds +1 stage every turn — not counted here';
  if(mon.ab==='Contrary') return 'Contrary turns each self-lowering attack into a boost — counted in the what-if buttons';
  if(mon.ab==='Simple') return 'Simple doubles every stat stage — counted in the what-if buttons';
  if(mon.ab==='Adaptability') return 'Adaptability makes STAB ×2 — counted in the damage figures';
  return null;
}

// An opponent as a defender the shared eff() can read, so THEIR abilities
// finally count.  Previously an enemy Levitate or Flash Fire was displayed and
// then ignored by every calculation on the page.
const oppMon=o=>({name:o.n,types:(DEX[o.n]||{t:[]}).t,ab:o.a||'',
                  b:(DEX[o.n]||{}).b,lvl:parseInt(o.l,10)||50});
const dealTo=(mvType,om)=>eff(mvType,om)*atkMul(mvType);
const trOn=()=>Object.keys(mechOn).some(k=>mechOn[k]&&MECH[k].invert);
const ABS_IMMUNE={'Levitate':'ground','Storm Drain':'water','Water Absorb':'water',
  'Volt Absorb':'electric','Motor Drive':'electric','Flash Fire':'fire','Sap Sipper':'grass',
  'Lightningrod':'electric','Dry Skin':'water'};
// Abilities that change the defensive multiplier without granting an immunity.
const ABS_HALVE={'Thick Fat':['fire','ice'],'Heatproof':['fire']};
const ABS_FILTER=new Set(['Filter','Solid Rock']);   // super-effective x0.75
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const pick={};
TEAMS.forEach(t=>pick[t.id]=t.slots.map(s=>s.defaultIdx||0));
try{const s=JSON.parse(localStorage.getItem('bb_pick')||'{}');
  TEAMS.forEach(t=>{if(Array.isArray(s[t.id])&&s[t.id].length===t.slots.length)pick[t.id]=s[t.id];});}catch(e){}
const save=()=>{try{localStorage.setItem('bb_pick',JSON.stringify(pick));}catch(e){}};
const cur=t=>t.slots.map((s,i)=>s.options[Math.min(pick[t.id][i],s.options.length-1)].mon);

function eff(at,mon){
  if(ABS_IMMUNE[mon.ab]===at) return 0;
  let m=1; for(const ty of mon.types) m*=CHART[at][ty];
  // WONDER GUARD: anything not super-effective does nothing at all.  Tested on
  // the RAW type multiplier, because "super effective" is a property of the
  // type match-up -- resistances from other abilities do not change it.
  if(mon.ab==='Wonder Guard'&&m<=1) return 0;
  const h=ABS_HALVE[mon.ab]; if(h&&h.includes(at)) m*=0.5;
  if(m>1&&ABS_FILTER.has(mon.ab)) m*=0.75;
  return m;
}
// True when the number above is doing something the typing alone would not,
// so the UI can mark it instead of quietly showing a surprising figure.
function effAbil(at,mon){
  let raw=1; for(const ty of mon.types) raw*=CHART[at][ty];
  return eff(at,mon)!==raw ? mon.ab : null;
}
const vsTypes=(mv,ts)=>ts.reduce((a,t)=>a*CHART[mv][t],1)*atkMul(mv);
const MCLASS=m=>m===0?'m0':m<=0.25?'m25':m<=0.5?'m5':m===1?'m1':m<=2?'m2':'m4';
const MTXT=m=>m===0?'×0':m===0.25?'×¼':m===0.5?'×½':m===1?'×1':'×'+m;
const ico=t=>TICON[t]?`<img class="ico" src="${TICON[t]}" alt="${t}">`:`<span>${t}</span>`;
const spr=(n,c)=>SPRITE[n]?`<img class="${c||''}" src="${SPRITE[n]}" alt="${esc(n)}">`:'';
// A documented fight's own portrait, out of the ROM. TRFACE is keyed by SPRITE
// id rather than by trainer because one portrait serves several classes, and
// it is only populated for the fights this page can show -- so a missing key
// is normal and must render as nothing, not as a broken image.
const face=(e,c)=>(e&&e.face!=null&&TRFACE[e.face])
  ? `<span class="bface ${c||''}"><img src="${TRFACE[e.face]}" alt="${
      esc(e.leader||'')}"></span>` : '';
const weakCount=team=>TYPES.filter(at=>{const es=team.map(m=>eff(at,m));
  return es.some(e=>e>=2)&&!es.some(e=>e<1);}).length;

function moveDetail(name){
  const d=MOVES[name];
  if(!d) return `<details class="mv"><summary><span class="mn">${esc(name)}</span></summary></details>`;
  const acc=d.acc>100?'—':d.acc+'%', pw=d.c==='status'?'status':(d.p<=1?'var':d.p);
  const f=[];
  if(d.ail) f.push(`<span class="flag f-ail">${d.ch>0?d.ch+'% ':''}${esc(d.ail)}</span>`);
  if(d.stat) f.push(`<span class="flag f-stat">${esc(d.stat)} change</span>`);
  if(d.pri!==0) f.push(`<span class="flag f-pri">priority ${d.pri>0?'+':''}${d.pri}</span>`);
  const n=NOTES[name];
  const body=n?`<p class="mvnote">${n}</p>`:(d.ail||d.stat)?`<p class="mvnote">${esc(d.d)}</p>`
    :`<p class="mvplain">Plain attack — no secondary effect.</p>`;
  return `<details class="mv"><summary>${TICON[d.t]?`<img src="${TICON[d.t]}" alt="${d.t}">`:''}
    <span class="mn">${esc(name)}</span><span class="pw">${pw}${d.c!=='status'?' / '+acc:''}</span></summary>
    <div class="mvbody"><p class="mvstat">${esc(d.t)} · ${esc(d.c)} · pow ${pw} · acc ${acc} · pp ${d.pp}</p>
    ${f.join('')}${body}</div></details>`;
}

const SN=['HP','ATK','DEF','SPA','SPD','SPE'];
function bars(m,gmax,tmax){
  const raw=m.stats; if(!raw) return '';
  const KEYS=['hp','atk','def','spa','spd','spe'];
  const st=KEYS.map(k=>statOf(m,k));
  const boosted=KEYS.map(k=>statMul(m,k)!==1);
  const mx=gmax||Math.max(...st,1);
  const tot=st.reduce((a,b)=>a+b,0), tm=tmax||tot;
  const note=statNote(m);
  const nat=natEffect(m.nat);
  const natCls=i=>nat?(KEYS[i]===nat.up?' nat-up':KEYS[i]===nat.down?' nat-down':''):'';
  return `<div class="bars">${st.map((v,i)=>`<span class="bn${natCls(i)}"${
      natCls(i)?` title="${esc(m.nat)}: ${natCls(i)===' nat-up'?'+':'\u2212'}10% ${SN[i]}"`:''
    }>${SN[i]}</span>
    <span class="bt"><span class="bf" style="width:${Math.min(100,Math.max(4,Math.round(v/mx*100)))}%"></span></span>
    <span class="bv${boosted[i]?' up':''}"${boosted[i]?` title="${esc(m.ab)}: ${raw[i]} → ${v}"`:''}>${v}${
      boosted[i]?'<sup class="abmark">a</sup>':''}</span>`).join('')}
    <span class="totrule"></span>
    <span class="bn tot">TOT</span>
    <span class="bt tot"><span class="bf" style="width:${Math.min(100,Math.max(4,Math.round(tot/tm*100)))}%"></span></span>
    <span class="bv tot">${tot}</span></div>${
    note?`<p class="statnote">${esc(note)}</p>`:''}`;
}

const SNAME={atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe',acc:'Acc',eva:'Eva'};
// One row per slot, and only where it can do something: a Pokemon that knows
// no stat move gets no row rather than an empty control.
function boostRow(m){
  const mvs=boostMoves(m); if(!mvs.length) return '';
  const key=esc(bKey(m)), act=bState[bKey(m)]||{}, st=stagesOf(m);
  // The tooltip must quote the EFFECTIVE change, not the move's printed one.
  // On a Contrary holder V-create raises the stats it says it lowers, and a
  // button reading "Spe -1" while the page got faster is worse than no
  // tooltip at all.
  const fx=d=>{const st=stageFx(m,d);
    return Object.keys(st).map(k=>`${SNAME[k]} ${st[k]>0?'+':''}${st[k]}`).join(', ');};
  const flip=m.ab==='Contrary'||m.ab==='Simple'
    ? ` (${m.ab} is applied)` : '';
  const btns=mvs.map(n=>{const d=MOVES[n], c=act[n]||0;
    return `<button class="bmv${c?' on':''}" data-bmv="${key}::${esc(n)}" data-bmax="${bMax(d,m)}" title="${esc(n)}: ${
      esc(fx(d))}${d.tg==='foe'?" to whatever you are facing":''}${esc(flip)}. Click to apply, again to stack, past the cap to clear."
      >${esc(n)}${c>1?`<i>&times;${c}</i>`:''}</button>`;}).join('');
  // Accuracy and evasion stages are real but the damage numbers do not model
  // them, so they are shown greyed rather than implied to have done something.
  const chip=(pre,k,v)=>`<span class="stg ${v>0?'up':'dn'}${k==='acc'||k==='eva'?' inert':''}"${
    k==='acc'||k==='eva'?' title="Applied, but accuracy is not part of the damage numbers"':''
    }>${pre}${SNAME[k]} ${v>0?'+':''}${v}</span>`;
  const chips=Object.keys(st.self).map(k=>chip('',k,st.self[k])).join('')
    +Object.keys(st.foe).map(k=>chip('foe ',k,st.foe[k])).join('');
  return `<div class="boostrow"><span class="blab" title="Apply a stat change this
    Pokémon can actually cause, and every number on the tab recomputes">what if</span>${
    btns}${chips}${chips?`<button class="bclr" data-bclr="${key}">clear</button>`:''}</div>`;
}
// Boosts silently rewrite every number on the tab, so the page says so out loud
// in one place rather than letting a +6 Attack figure pass for the real one.
function boostBanner(){
  if(!anyBoost()) return '';
  const who=Object.keys(bState).filter(k=>Object.values(bState[k]).some(n=>n>0))
    .map(k=>esc(k.split('|')[0]));
  return `<div class="boostbar"><b>Boosts on</b><span>${who.join(', ')} —
    damage, speed order and the matrices below all include them.</span>
    <button class="bclr" data-bclr="*">clear all</button></div>`;
}

function monBlock(m,why,gmax,tmax){
  const box=(head,body)=>`<span class="tipbox"><b>${esc(head)}</b>${esc(body)}</span>`;
  const tipSpan=(label,head,body)=>
    `<span class="tip" tabindex="0" title="${esc(head)}: ${esc(body)}">${label}${box(head,body)}</span>`;
  const tt=t=>tipSpan(ico(t),t,
    `Weak to ${TYPES.filter(a=>CHART[a][t]>1).join(', ')||'nothing'}. `+
    `Resists ${TYPES.filter(a=>CHART[a][t]<1&&CHART[a][t]>0).join(', ')||'nothing'}.`);
  // Per-slot type coverage.  A single leading letter cannot identify a type --
  // F is Fire/Fighting/Flying, G is Ghost/Grass/Ground, D is Dark/Dragon,
  // P is Poison/Psychic -- so 10 of 17 would collide and colour alone would be
  // doing the identifying.  Three letters are unique across all 17 and match
  // the type chart's own abbreviations.  Only non-neutral types are shown,
  // because x1 is the default and listing it is noise.
  // Every one of the 17 types, always in the same order, so the grid has the
  // same shape on every slot and can be pattern-matched across the roster.
  // Three-letter codes because a single leading letter collides for 10 of 17
  // (F = fire/fighting/flying, G = ghost/grass/ground, D = dark/dragon,
  // P = poison/psychic), which would leave colour doing the identifying.
  const covHTML=`<div class="tcov" title="What each attacking type does to ${esc(m.name)}">${
    TYPES.map(t=>{const e=eff(t,m);
      const cls=e===0?'m0':e<=0.25?'m25':e<=0.5?'m5':e===1?'m1':e>=4?'m4':'m2';
      return `<b class="${cls}" title="${esc(t)} → ${MTXT(e)}">${t.slice(0,3)}<i>${
        MTXT(e).replace('\u00d7','')}</i></b>`;}).join('')}</div>`;
  return `<div class="idbar">${spr(m.name,'sp')}
    <div class="idtext"><div class="nm">${esc(m.name)} ${m.shiny?'<span class="shiny" title="shiny">&#9670;</span>':''}</div>
      <div class="tline">${m.types.map(tt).join('')}</div>
    </div>${covHTML}</div>
    <div class="meta metarow"><b>${esc(m.nat)}</b> · ${ABIL[m.ab]?tipSpan(esc(m.ab),m.ab,ABIL[m.ab]):esc(m.ab)}${m.item?' · @'+(ITEMDESC[m.item]?tipSpan(esc(m.item),m.item,ITEMDESC[m.item]):esc(m.item)):''} · L${m.lvl} · ${esc(m.box)}</div>
    ${bars(m,gmax,tmax)}
    ${boostRow(m)}
    <div class="movelist">${m.moves.map(moveDetail).join('')}</div>
    ${why?`<p class="why">${why}</p>`:''}`;
}

/* ranking of my six against a given defending/attacking type set */
// `om` is an optional real opponent.  With it, what you DEAL accounts for the
// defender's ability; without it (the type-lookup box, where you type a typing
// and no species) it falls back to types alone.
function rankRows(mons,ts,om){
  return mons.map(m=>{
    const takes=Math.max(...ts.map(t=>eff(t,m)));
    let best={e:0,mv:null};
    m.moves.forEach(mv=>{const d=MOVES[mv]; if(!d||d.c==='status')return;
      const e=om?dealTo(d.t,om):vsTypes(d.t,ts); if(e>best.e) best={e,mv};});
    return {m,takes,deals:best.e,mv:best.mv,dmg:om?calcDamage(m,best.mv,om):null};
  }).sort((a,b)=>a.takes-b.takes||b.deals-a.deals);
}
const rankHTML=rows=>`<div class="rank">${rows.map((r,i)=>`<div class="rrow${i===0?' best':''}">
  ${spr(r.m.name)}<span class="rn">${esc(r.m.name)}</span>
  <span class="lbl">takes</span><span class="mult ${MCLASS(r.takes)}">${MTXT(r.takes)}</span>
  <span class="spacer"></span><span class="lbl">best hit</span>
  <span class="mult ${MCLASS(r.deals)}">${MTXT(r.deals)}</span>
  <span class="mvname">${r.mv?esc(r.mv):'—'}</span></div>`).join('')}</div>`;

const look={a:'',b:'',name:''};

function lookupPanel(mons){
  const opts=t=>TYPES.map(x=>`<option value="${x}"${x===t?' selected':''}>${x}</option>`).join('');
  let res='';
  if(look.a){
    const ts=[look.a]; if(look.b&&look.b!==look.a) ts.push(look.b);
    res=`<p class="oppline">${look.name&&SPRITE[look.name]?spr(look.name,'big'):''}
      <span class="lbl">facing</span>${look.name?`<b>${esc(look.name)}</b>`:''}
      ${ts.map(ico).join('')}<b>${ts.join(' / ')}</b></p>${rankHTML(rankRows(mons,ts))}`;
  }
  return `<div class="panel"><div class="lookup">
    <div class="fld"><label>look up opponent</label>
      <input id="oppname" list="dexlist" placeholder="e.g. Skarmory" autocomplete="off" value="${esc(look.name)}"></div>
    <div class="fld"><label>or type 1</label><select id="t1"><option value="">—</option>${opts(look.a)}</select></div>
    <div class="fld"><label>type 2</label><select id="t2"><option value="">—</option>${opts(look.b)}</select></div>
    <button id="clr" type="button">clear</button></div>${res}</div>`;
}

/* ============================ THE FREE-FORM CALCULATOR =====================
   Every damage number on this page is against a DOCUMENTED fight -- a gym
   leader, a rival, the trainers in Drayano's own file. That covers the
   question "am I ready for what is next" and answers nothing about the
   Pokemon you just met on a route, or the one a friend is threatening you
   with, or the what-if you are turning over.

   IT LIVES HERE, IN THE TEMPLATE, and not in a tab of its own, because
   `calcDamage` lives here: the Gen 5 formula, the type chart, both sides'
   abilities, the item multipliers, the weather toggles and the stat-stage
   what-ifs. A calculator anywhere else would be a second implementation of
   all of that, which is the drift this project spends most of its tests
   preventing. Hosting it here also means the published sheet gets it.

   THE DEFENDER'S SPREAD IS THE PAGE'S STANDING ASSUMPTION -- 31 IVs, 0 EVs,
   neutral nature, exactly as every other opponent on this page is built,
   because a calculator that quietly used a different one would disagree with
   the card above it. The attacker is REAL: your own stats, straight from the
   save.
*/
let calc={atk:'',def:'',lvl:50,ab:'',allAb:false};
try{const c=JSON.parse(localStorage.getItem('bb_calc')||'{}');
  if(c&&typeof c==='object') calc={...calc,...c};}catch(e){}
const saveCalc=()=>{try{localStorage.setItem('bb_calc',JSON.stringify(calc));}catch(e){}};

/* A defender built the way every opponent on this page is built. */
function calcDefender(name,lvl,ab){
  const d=DEX[name]; if(!d) return null;
  /* NO ABILITY CHOSEN IS NOT THE SAME AS NO ABILITY, and defaulting to the
     latter quietly produced the page's worst kind of answer. Pick Rotom, leave
     the ability alone, and Earthquake read a confident ~50% against a Pokemon
     whose every slot is Levitate -- there is no legal Rotom that Earthquake
     touches. Where the species' slots are all the SAME ability the choice
     cannot go the other way, so it is filled in rather than left blank. Where
     they genuinely differ, blank still means blank: the control exists because
     that is a real question, and guessing a slot would be inventing an
     opponent. */
  let use=ab||null;
  if(!use){
    const opts=[...new Set((d.a||[]).filter(Boolean))];
    if(opts.length===1) use=opts[0];
  }
  return {name,lvl:Math.max(1,Math.min(100,lvl|0))||50,ab:use,types:d.t,b:d.b};
}

function calcPanel(mons){
  const me=mons.find(m=>m.name===calc.atk)||mons[0];
  const om=calc.def?calcDefender(calc.def,calc.lvl,calc.ab):null;
  /* THE ABILITIES IT COULD ACTUALLY HAVE, not all 165.
     Naming a defender and then scrolling a list of every ability in the game
     to find one of its two is a search through noise: the answer is a property
     of the species and the ROM knows it. DEX[name].a carries both slots plus
     the hidden one, from this hack's own personal table -- so Slowking offers
     Drizzle, which is a Blaze Black change and exactly the kind of thing a
     vanilla-shaped list would bury.

     The full list stays one click away rather than being removed. This page
     already models rigged Pokémon elsewhere, and an opponent with an ability
     it cannot legally have is a thing you might genuinely be facing. */
  const nat=(om&&DEX[om.name]&&DEX[om.name].a)||[];
  const showAll=calc.allAb||!nat.length;
  // Whatever is currently chosen stays selectable even when it is not natural,
  // or narrowing the list would silently reset the field under you.
  const abilList=showAll?Object.keys(ABIL).filter(a=>a&&a!=='--').sort()
    :[...new Set([...nat,...(calc.ab?[calc.ab]:[])])];
  const abilOpts=['<option value="">no ability</option>']
    .concat(abilList
      .map(a=>`<option value="${esc(a)}"${a===calc.ab?' selected':''}>${esc(a)}${
        !showAll&&nat.indexOf(a)<0?' (not natural)':''}</option>`)).join('');

  let out='';
  if(me&&om){
    /* Every move it has, worst to best -- the order you care about is "what
       is my best line", and a list sorted by damage answers it directly. */
    const rows=(me.moves||[]).map(mv=>({mv,d:calcDamage(me,mv,om)}))
      .sort((a,b)=>((b.d&&b.d.pctLo)||-1)-((a.d&&a.d.pctLo)||-1));
    const survives=rows.every(r=>!r.d||r.d.pctLo<100);
    out=`<div class="calcout">
      <p class="oppline">${SPRITE[me.name]?spr(me.name,'big'):''}
        <span class="lbl">L${esc(me.lvl)}</span><b>${esc(me.name)}</b>
        <span class="lbl">into</span>
        ${SPRITE[om.name]?spr(om.name,'big'):''}
        <span class="lbl">L${esc(om.lvl)}</span><b>${esc(om.name)}</b>
        ${om.types.map(ico).join('')}
        ${om.ab?`<span class="lbl">${esc(om.ab)}</span>`:''}</p>
      <table class="calctab"><thead><tr><th>move</th><th>type</th><th>damage</th>
        <th>%</th><th></th><th>KO</th></tr></thead><tbody>
      ${rows.map(r=>{
        const md=MOVES[r.mv]||{};
        if(!r.d) return `<tr class="dim"><td><b>${esc(r.mv)}</b></td>
          <td>${md.t?ico(md.t):''}</td><td colspan="4" class="lbl">${
            md.c==='status'?'status move — no damage':'variable power, not modelled'}</td></tr>`;
        return `<tr${r.d.pctLo>=100?' class="kills"':''}>
          <td><b>${esc(r.mv)}</b></td><td>${md.t?ico(md.t):''}</td>
          <td class="num">${r.d.lo}–${r.d.hi}</td>
          <td class="num">${dmgTxt(r.d)}</td>
          <td class="barcell">${hpBar(r.d)}</td>
          <td class="lbl">${r.d.e===0?'—':esc(r.d.ko)}</td></tr>`;}).join('')}
      </tbody></table>
      ${survives?`<p class="calcnote">Nothing you have one-shots it. ${
        rows.length&&rows[0].d?`Best is <b>${esc(rows[0].mv)}</b> at ${dmgTxt(rows[0].d)}.`:''}</p>`
        :`<p class="calcnote ok">${esc(rows[0].mv)} takes it out in one.</p>`}
      <p class="calcnote lbl">Their spread is this page's standing assumption — 31 IVs,
        0 EVs, neutral nature — the same way every opponent above is built. Yours are
        real, from your save. The weather and stat-stage toggles above apply here too.</p>
    </div>`;
  } else if(me&&!calc.def){
    out=`<p class="calcnote lbl">Name anything in the dex and this works out every move
      ${esc(me.name)} has against it — the same maths the fights above use, against
      whatever you actually ran into.</p>`;
  } else if(calc.def){
    out=`<p class="calcnote lbl">No species called “${esc(calc.def)}”.</p>`;
  }

  return `<div class="panel calcpanel">
    <h3 class="zsub" style="margin:0 0 10px;font-weight:700;font-size:15px">
      Damage against anything</h3>
    <div class="lookup">
      <div class="fld"><label>your Pokémon</label><select id="cAtk">${
        mons.map(m=>`<option value="${esc(m.name)}"${me&&m.name===me.name?' selected':''}>${
          esc(m.name)} · L${esc(m.lvl)}</option>`).join('')}</select></div>
      <div class="fld"><label>against</label>
        <input id="cDef" list="dexlist" placeholder="e.g. Garchomp" autocomplete="off"
          value="${esc(calc.def)}"></div>
      <div class="fld"><label>their level</label>
        <input id="cLvl" type="number" min="1" max="100" value="${esc(calc.lvl)}"></div>
      <div class="fld abfld"><label>their ability</label><select id="cAb">${abilOpts}</select>
        ${nat.length?`<button class="minibtn aball${calc.allAb?' on':''}" id="cAll" type="button"
          title="${calc.allAb?`Show only what ${esc(om.name)} can have`
            :'Show every ability in the game — for a rigged or hacked opponent'}">${
          calc.allAb?`only ${esc(om.name)}'s`:'all abilities'}</button>`:''}</div>
      <button id="cClr" type="button">clear</button></div>
    ${out}</div>`;
}

let encIdx=0, benched={}, fmt='singles', fieldE=[], fieldM=[];
/* THE FIGHT ALREADY KNOWS WHAT FORMAT IT IS, so stop asking.
   Every opponent record carries Drayano's own `type` -- "Single Battle",
   "Double Battle", "Triple Battle", "Rotation Battle", and a few compound
   ones like "Double Battle (Initial) / Single Battle (Rematch)" where the
   first named type is the fight you are walking into. Making you pick the
   format by hand meant the default was wrong for every multi-Pokemon fight in
   the game, silently: a singles board against a double battle is not a
   caveat, it is the wrong question answered confidently.
   Compound strings are read up to the first slash for that reason. Triple and
   Rotation put more than two on the field and this page caps at two, so they
   take the wider setting and the real type is printed beside it rather than
   rounded away. */
/* ROTATION IS SINGLES. Only one Pokemon per side is ever ON the field in a
   rotation battle -- you spin between three rather than fielding three -- so
   the one-on-one board is exactly the right model and the only thing it misses
   is that rotating is cheaper than switching. Lumping it in with doubles cost
   four fights a usable board, Drayden and Cheren 4 among them, and replaced
   them with a note apologising for not modelling a game they are not playing. */
const fmtOf=(e)=>/double|triple/i.test(String(e&&e.type||'').split('/')[0])
  ? 'doubles' : 'singles';
const isRotation=(e)=>/rotation/i.test(String(e&&e.type||'').split('/')[0]);
/* Which fight `fmt` was last derived for. A manual toggle has to stick while
   you are on that fight -- otherwise the buttons do nothing and read as
   broken -- but changing fights re-derives. */
let fmtFor=null;
/* Which of the doubles pairings is on screen. Reset with the fight, like the
   fielded names, so a stale index cannot point at a matchup that is not here. */
let pairIdx=0;
/* OPPONENT IDENTITY IS THE ROSTER SLOT, NOT THE SPECIES NAME.
   Their side was keyed by o.n throughout -- the fielded list, the buttons,
   every lookup -- which is fine until a roster repeats a species. N 4 is SIX
   Rotom: six buttons all reading data-fe="Rotom", a fielded list that can only
   hold "Rotom" once, and every lookup resolving to team[0]. Five of the six
   were unreachable and unviewable, which is what "they all appear as one" is.
   Formes make it worse than cosmetic -- those six are formes 0..5 with
   different movesets, so picking the second one has to give you the second
   one's moves.
   The key is species + slot index. eKey/eFind are the only two places that
   know the shape, and a bare name still resolves (to the first match) so a
   fielded list restored from an older bb_enc keeps working. */
const eKey=(o,i)=>`${o.n}#${i}`;
const eFind=(team,k)=>{
  const i=team.findIndex((o,j)=>eKey(o,j)===k);
  return i>=0?team[i]:(team.find(o=>o.n===k)||null);   // legacy bare name
};
/* What to call it when a species appears more than once on one roster. The
   slot number is the honest answer: the forme id is known but its NAME is not
   -- personal.json stops at 649 -- and inventing "Heat Rotom" here would be
   the drawn-mascot mistake in a different costume. */
const eLabel=(team,o,i)=>{
  if(team.filter(x=>x.n===o.n).length<2) return o.n;
  const n=team.slice(0,i+1).filter(x=>x.n===o.n).length;
  return o.forme?`${o.n} · forme ${o.forme}`:`${o.n} · ${n}`;
};
/* HOW MANY TURNS THE BOARD LOOKS AHEAD. Persisted: it is a way of reading the
   board rather than a question you ask once. Two is the default because it is
   the shallowest depth at which a switch can be worth making -- at one turn a
   switch is all cost and no reason, which is the whole point of the search. */
let gDepth=2;
try{const d=parseInt(localStorage.getItem('bb_gdepth'),10); if(d>=1&&d<=2) gDepth=d;}catch(e){}
let encFilter='all', encIdxOpen=true, cleared={}, encNotes={};
try{const c=JSON.parse(localStorage.getItem('bb_cleared')||'{}'); if(c&&typeof c==='object') cleared=c;}catch(e){}
// PROGRESS IS KEYED ON A STABLE ID, NOT ON POSITION.
// It used to key on the index in OPPONENTS, which meant that dropping a single
// fight -- the Opelucid leader who is not in your version -- silently
// re-attributed every mark after it to the wrong trainer. `key` is a slug of
// the fight's own name, so the roster can change shape underneath your ticks.
// Numeric keys from before this are migrated once, through the order they were
// written against.
const cKey=e=>(e&&e.key)||'';
(function(){let moved=false;
  for(const k of Object.keys(cleared)){
    if(!/^\d+$/.test(k)) continue;
    const e=OPPONENTS[+k]; delete cleared[k];
    if(e&&cKey(e)){cleared[cKey(e)]=1; moved=true;}
  }
  if(moved){try{localStorage.setItem('bb_cleared',JSON.stringify(cleared));}catch(e){}}
})();
try{const n=JSON.parse(localStorage.getItem('bb_encnotes')||'{}'); if(n&&typeof n==='object') encNotes=n;}catch(e){}
const saveProg=()=>{try{localStorage.setItem('bb_cleared',JSON.stringify(cleared));
  localStorage.setItem('bb_encnotes',JSON.stringify(encNotes));}catch(e){}};
// Your level, taken from whatever is actually fielded, for the gap readout.
const myLevel=()=>{const t=TEAMS.find(x=>x.state==='fielded')||TEAMS[0];
  if(!t) return null;
  const ls=t.slots.map(s=>s.options[0].mon.lvl).filter(Boolean);
  return ls.length?Math.max(...ls):null;};
const nextFight=()=>{for(let i=0;i<OPPONENTS.length;i++) if(!cleared[cKey(OPPONENTS[i])]) return i; return -1;};
try{const st=JSON.parse(localStorage.getItem('bb_enc')||'{}');
  // A JUMP FROM ANOTHER TAB ARRIVES AS A KEY, NOT AN INDEX.
  // Adventure works on the COMPLETE roster (it stores positions of its own,
  // and AREAINDEX keys on them); this page has already dropped the Opelucid
  // leader who is not in your cartridge. So the two lists differ in length and
  // an index handed across meant everything after Opelucid opened the wrong
  // fight -- Cheren 7 landed on Shauntal. Same rule as bb_cleared: pass the
  // stable slug and resolve it here.
  if(typeof st.key==='string'){const j=OPPONENTS.findIndex(e=>cKey(e)===st.key); if(j>=0) encIdx=j;}
  else if(Number.isInteger(st.i)) encIdx=st.i;
  if(typeof st.f==='string') encFilter=st.f;
  if(typeof st.o==='boolean') encIdxOpen=st.o;
  /* Restored as NAMES, not positions, and only up to the format's cap. What
     is actually on this fight's roster is settled by encounterPanel, which
     already filters both lists against it every render -- so a stale name
     from another fight simply drops out rather than needing a guard here. */
  if(Array.isArray(st.fe)) fieldE=st.fe.filter(x=>typeof x==='string').slice(0,2);
  if(Array.isArray(st.fm)) fieldM=st.fm.filter(x=>typeof x==='string').slice(0,2);}catch(e){}
/* WHO IS ON THE FIELD SURVIVES A RELOAD. The fight was remembered and so was
   the look-ahead, but the pairing was not -- so every reload emptied the one
   thing you had to click twice to set, and the board you were reading vanished
   with it. Stored by NAME, and filtered against the current fight on the way
   back in, so switching opponent cannot resurrect somebody who is not there. */
const saveEnc=()=>{try{localStorage.setItem('bb_enc',
  JSON.stringify({i:encIdx,f:encFilter,o:encIdxOpen,
                  key:cKey(OPPONENTS[encIdx]||{}),fe:fieldE,fm:fieldM}));}catch(e){}};

// rough stat estimate for an opponent: 31 IVs, no EVs, neutral nature
const estStat=(base,lvl,isHP)=> isHP
  ? Math.floor((2*base+31)*lvl/100)+lvl+10
  : Math.floor((2*base+31)*lvl/100)+5;
const enemyLvl=o=>{const m=String(o.l||'').match(/\d+/); return m?+m[0]:50;};
const enemySpe=o=>{const d=DEX[o.n]; if(!d||!d.b) return null;
  // Their ability applies as much as yours does: Swift Swim in rain, Chlorophyll
  // in sun, Sand Rush in sand, Slow Start on the way in.
  return Math.floor(estStat(d.b[5],enemyLvl(o),false)*abilMul(oppMon(o),'spe'));};

function matchLine(me,o){
  const om=oppMon(o), ot=om.types;
  let best={e:0,mv:null};
  me.moves.forEach(mv=>{const d=MOVES[mv]; if(!d||d.c==='status')return;
    const e=dealTo(d.t,om); if(e>best.e) best={e,mv};});
  const dmg=calcDamage(me,best.mv,om);
  let worst={e:0,t:null};
  ot.forEach(t=>{const e=eff(t,me); if(e>worst.e) worst={e,t};});
  const es=enemySpe(o), ms=spdOf(me);
  // TRICK ROOM INVERTS THIS. The speed ladder already knew; this verdict did
  // not, so the one team the mechanic exists for was told it moved second.
  const fast = es==null?null:(trOn()?ms<es:ms>es);
  const verdict = worst.e>=2 && best.e<2 ? 'bad' : best.e>=2 && worst.e<1 ? 'good' : 'ok';
  return `<div class="mline ${verdict}">
    ${spr(o.n)}<span class="mtarget">${esc(o.n)}</span>
    <span class="lbl">you deal</span><span class="mult ${MCLASS(best.e)}">${MTXT(best.e)}</span>
    ${dmg?`${hpBar(dmg)}<span class="dmg">${dmgTxt(dmg)}</span>${dmg.ko?`<span class="ko ${
      dmg.ko.startsWith('1')?'k1':dmg.ko.startsWith('2')?'k2':'kx'}">${dmg.ko}</span>`:''}`:''}
    <span class="mvname">${best.mv?esc(best.mv):'—'}</span>
    <span class="lbl">you take</span><span class="mult ${MCLASS(worst.e)}">${MTXT(worst.e)}</span>
    <span class="spd ${fast===null?'':fast?'f':'s'}">${fast===null?'speed ?':fast?'▲ you first':'▼ they first'}</span>
  </div>`;
}

// ===========================================================================
// THE TURN AS A MATRIX GAME
// ===========================================================================
// Everything above this line answers "how much damage does X do to Y". That is
// a calculation you can only use if you already know what the other side is
// going to do -- and you do not. A turn in this game is SIMULTANEOUS and the
// information is IMPERFECT: you and the trainer both commit, then the moves
// resolve. So the honest object is not a number, it is a payoff matrix.
//
// What that buys, in order of how much it is worth:
//
//   "EARTHQUAKE IS SAFE" -- there is a move that is at least as good as every
//   alternative against everything they can do. A dominant strategy. You do
//   not have to guess, and no calculator that reports one column at a time can
//   tell you this.
//
//   "NOTHING IS SAFE" -- your best guaranteed outcome, and what it costs.
//   This is the maximin, and it is worth saying out loud that MAXIMIN IS THE
//   NUZLOCKE'S OWN OBJECTIVE FUNCTION. A nuzlocker is not maximising expected
//   damage, they are maximising the worst case, because a loss is permanent.
//   The mode that already exists in this app wants exactly this number.
//
//   THE MIX. When the game has no pure equilibrium, the equilibrium is a
//   probability -- and "you have to guess, here is the split" is a real
//   answer rather than a shrug.
//
// The maths is exact and offline. Nothing is learned, nothing is fitted, and
// the same fight gives the same board every time.
// ---------------------------------------------------------------------------

/* DAMAGE COMING THE OTHER WAY.
   calcDamage() has only ever gone from you to them, so "what can they do to
   me" has never been a number on this page -- only a type multiplier. The
   asymmetry is real and is preserved: THEIR attack stat is estimated from base
   stats at the page's standing 31/0/neutral assumption, YOUR defence is the
   real one out of the save, with your stat stages and abilities applied. */
function calcIncoming(o,mvName,me){
  const md=MOVES[mvName]; if(!md||md.c==='status') return null;
  if(!md.p||md.p<=1||!me||!me.stats) return null;      // variable-power moves
  const d=DEX[o.n]; if(!d||!d.b) return null;
  const phys=md.c==='physical';
  const att=oppMon(o), lvl=att.lvl;
  const A=Math.max(1,Math.floor(estStat(d.b[phys?1:3],lvl,false)*abilMul(att,phys?'atk':'spa')));
  const D=Math.max(1,statOf(me,phys?'def':'spd'));
  const hp=me.stats[SIDX.hp]; if(!hp) return null;
  const e=eff(md.t,me);
  if(e===0) return {e:0,hp,lo:0,hi:0,pctLo:0,pctHi:0,ko:null};
  let m=e*atkMul(md.t);
  m*= (att.types||[]).includes(md.t) ? (att.ab==='Adaptability'?2:1.5) : 1;
  const im=ITEM_MUL[o.i]||{};
  if(im.all) m*=im.all;
  if(im.phys&&phys) m*=im.phys;
  if(im.spec&&!phys) m*=im.spec;
  if(im.se&&e>1) m*=im.se;
  const base=Math.floor(Math.floor(Math.floor(2*lvl/5+2)*md.p*A/D)/50)+2;
  const lo=Math.max(1,Math.floor(base*m*0.85)), hi=Math.max(1,Math.floor(base*m));
  const koMax=Math.ceil(hp/lo), koMin=Math.ceil(hp/hi);
  return {e,hp,lo,hi,pctLo:lo/hp*100,pctHi:hi/hp*100,
          ko:koMin===koMax?`${koMin}HKO`:`${koMin}–${koMax}HKO`};
}

const PRIO=mv=>{const d=MOVES[mv]; return d&&d.pri||0;};

/* ===========================================================================
   THE BATTLE AS A STOCHASTIC GAME
   ===========================================================================
   One turn was not enough, and the giveaway was that A SWITCH COULD NEVER
   SCORE POSITIVE. That was not a bug, it was the horizon: over a single turn a
   switch deals nothing and takes a hit, so its payoff is <= 0 by construction.
   Everything that makes switching correct -- you are now facing them with
   something that walls them, and you get the next turn -- lives exactly one
   ply past where a one-turn board can see. The same argument applies to a
   setup move, for the same reason.

   So the board is now the base case of a recursion, not the whole model. The
   right object is a two-player zero-sum MARKOV GAME, and the classic solution
   is Shapley's: the value of a state is the value of a matrix game whose
   entries are the values of the successor states.

       V(S, d)  =  leaf(S)                              if d = 0 or S is over
                =  gameValue([ V(step(S,a,b), d-1) ])   otherwise

   The one-turn board is V(S, 1) with the leaf being material. Everything below
   is that sentence, made runnable.

   WHAT MAKES IT TRACTABLE, given the state space is astronomically large:

     - The opponent's exact roster is in the ROM, so there is no belief state
       over what they might have.
     - Damage is the average roll, so a joint action leads to ONE successor
       rather than a distribution. That is the assumption that collapses the
       chance nodes, and it is stated on the page.
     - HP is quantised to 1/256 of a bar, which makes the state space finite
       and the transposition table exact with respect to that abstraction.
     - A node budget, because a search that can hang the page is not shippable.

   WHAT IT STILL DOES NOT MODEL, and this matters more at depth than it did at
   one turn: stat stages. Depth is exactly what would reveal what a Dragon
   Dance buys, and it is not modelled, so setup moves are still valued at the
   damage they do this turn -- which is nothing. Said out loud on the page
   rather than left for someone to discover.
   =========================================================================== */

const HPQ=256;                                   // HP grain: 1/256 of a bar
const qhp=x=>Math.max(0,Math.round(x*HPQ))/HPQ;
const NODE_BUDGET=240000;                        // a search must terminate
/* How much the leaf cares about the matchup it is leaving behind, on top of
   raw material. This is THE ARGUABLE NUMBER in the whole feature: everything
   else is the game's own arithmetic, and this is a judgement about how much a
   good position is worth in Pokemon-equivalents. Deliberately small. */
const POS_W=0.35;

/* Everything the search needs, precomputed once. Damage is by far the most
   expensive call in here and the search asks for the same numbers thousands of
   times, so it asks once. */
function buildSim(myTeam,theirTeam){
  const mvM=myTeam.map(m=>(m.moves||[]).filter(mv=>MOVES[mv]));
  const mvT=theirTeam.map(o=>(o.m||[]).filter(mv=>MOVES[mv]));
  const fr=(d)=>!d?0:Math.min(1,((d.lo+d.hi)/2)/d.hp);
  /* Damage at NEUTRAL stages. Stages are applied at use, in stepTurn, because
     they are a property of the position rather than of the pairing -- and
     because precomputing 13^5 of them is not a plan. */
  const out=myTeam.map((m,i)=>theirTeam.map((o,j)=>
    mvM[i].map(mv=>fr(calcDamage(m,mv,oppMon(o))))));
  const inc=theirTeam.map((o,j)=>myTeam.map((m,i)=>
    mvT[j].map(mv=>fr(calcIncoming(o,mv,m)))));
  const cat=mv=>(MOVES[mv]||{}).c;
  const stg=mv=>(MOVES[mv]||{}).st||null;
  const tgt=mv=>(MOVES[mv]||{}).tg||'self';
  return {myTeam,theirTeam,mvM,mvT,out,inc,
          priM:mvM.map(l=>l.map(PRIO)), priT:mvT.map(l=>l.map(PRIO)),
          catM:mvM.map(l=>l.map(cat)), catT:mvT.map(l=>l.map(cat)),
          stM:mvM.map(l=>l.map(stg)), stT:mvT.map(l=>l.map(stg)),
          tgM:mvM.map(l=>l.map(tgt)), tgT:mvT.map(l=>l.map(tgt)),
          speM:myTeam.map(m=>spdOf(m)),
          speT:theirTeam.map(o=>enemySpe(o))};
}

/* =========================================================================
   STAT STAGES
   =========================================================================
   The gap depth made worse rather than better. Looking further ahead is
   exactly what should reveal what a Dragon Dance buys, and while stages went
   unmodelled a setup move was scored on the damage it does this turn -- none --
   at every depth. It also meant Draco Meteor's -2 Sp. Atk and Close Combat's
   defence drop were free, which flatters the moves the search likes most.

   Stages live on the ACTIVE Pokemon and are lost when it switches out, which
   is both the real rule and the thing that keeps the state space finite: a
   branch only carries stages while something is actually set up. */
const STAGE0={atk:0,def:0,spa:0,spd:0,spe:0};
const SKEYS=['atk','def','spa','spd','spe'];
const stageKey=s=>SKEYS.map(k=>s[k]).join('');
function applyStages(cur,st){
  if(!st) return cur;
  const n={...cur};
  for(const k of SKEYS) if(st[k]) n[k]=Math.max(-6,Math.min(6,n[k]+st[k]));
  return n;
}
/* What a stage set does to one side's damage: the attacker's offensive stage
   multiplies, the defender's defensive stage divides. */
const dmgMul=(atkSt,defSt,phys)=>
  stageMul(atkSt[phys?'atk':'spa'])/stageMul(defSt[phys?'def':'spd']);

const aliveCount=h=>h.reduce((n,x)=>n+(x>0?1:0),0);

/* Actions available to one side. A fainted active (-1) may only send someone
   out, which is how a knockout is represented rather than special-cased. */
function actsMe(sim,S){
  const out=[];
  if(S.mi>=0) sim.mvM[S.mi].forEach((mv,k)=>out.push({kind:'move',mv,k,pri:sim.priM[S.mi][k]}));
  S.mh.forEach((h,i)=>{ if(h>0&&i!==S.mi) out.push({kind:'switch',i}); });
  return out;
}
function actsThem(sim,S){
  const out=[];
  if(S.ti>=0) sim.mvT[S.ti].forEach((mv,k)=>out.push({kind:'move',mv,k,pri:sim.priT[S.ti][k]}));
  S.th.forEach((h,j)=>{ if(h>0&&j!==S.ti) out.push({kind:'switch',i:j}); });
  return out;
}

/* One exchange, resolved in order. Switches land before attacks, and whoever
   faints does not get to act -- which is why turn order changes the payoff and
   not merely the flavour. */
/* NAMED stepTurn, NOT step. There is already a `step` in this file -- the
   prev/next button's encounter stepper -- and although it is function-scoped
   and shadows this one harmlessly today, two unrelated `step`s in one script
   is a trap set for whoever next moves code between scopes. */
function stepTurn(sim,S,a,b){
  let mi=S.mi, ti=S.ti;
  const mh=S.mh.slice(), th=S.th.slice();
  /* SWITCHING OUT LOSES YOUR STAGES. The real rule, and also what stops the
     state space compounding: a line only carries stages while something is
     still standing there set up. */
  let ms=S.ms, ts=S.ts;
  if(a.kind==='switch'){ mi=a.i; ms=STAGE0; }
  if(b.kind==='switch'){ ti=b.i; ts=STAGE0; }
  const aAtk=a.kind==='move', bAtk=b.kind==='move';
  if(aAtk||bAtk){
    let meFirst;
    if(aAtk&&!bAtk) meFirst=true;
    else if(!aAtk&&bAtk) meFirst=false;
    else if(a.pri!==b.pri) meFirst=a.pri>b.pri;
    else{
      /* Speed, with stages -- which is the whole point of an Agility or a
         Dragon Dance and was invisible while `faster` was precomputed. A tie
         still goes to them. */
      const es=sim.speT[ti], mySp=sim.speM[mi];
      if(es==null) meFirst=false;
      else{
        const mv=mySp*stageMul(ms.spe), tv=es*stageMul(ts.spe);
        meFirst=trOn()?mv<tv:mv>tv;
      }
    }
    const mine=()=>{ th[ti]=qhp(th[ti]-sim.out[mi][ti][a.k]
      *dmgMul(ms,ts,sim.catM[mi][a.k]==='physical')); };
    const theirs=()=>{ mh[mi]=qhp(mh[mi]-sim.inc[ti][mi][b.k]
      *dmgMul(ts,ms,sim.catT[ti][b.k]==='physical')); };
    /* Stage changes land AFTER the move that carries them -- a self-drop like
       Draco Meteor's -2 Sp. Atk costs you the NEXT attack, not this one, and a
       foe-drop like Growl hits whoever is standing there when it resolves. */
    const mineSt=()=>{ const st=sim.stM[mi][a.k];
      if(!st) return;
      if(sim.tgM[mi][a.k]==='self') ms=applyStages(ms,st); else ts=applyStages(ts,st); };
    const theirsSt=()=>{ const st=sim.stT[ti][b.k];
      if(!st) return;
      if(sim.tgT[ti][b.k]==='self') ts=applyStages(ts,st); else ms=applyStages(ms,st); };
    if(meFirst){
      if(aAtk){ mine(); mineSt(); }
      if(bAtk&&th[ti]>0){ theirs(); theirsSt(); }   // a fainted attacker does not attack
    }else{
      if(bAtk){ theirs(); theirsSt(); }
      if(aAtk&&mh[mi]>0){ mine(); mineSt(); }
    }
  }
  if(mi>=0&&mh[mi]<=0){ mi=-1; ms=STAGE0; }
  if(ti>=0&&th[ti]<=0){ ti=-1; ts=STAGE0; }
  return {mi,ti,mh,th,ms,ts};
}

/* MATERIAL, in Pokemon-equivalents: how much of their team is gone, minus how
   much of yours is. This is the unit every number on the board is printed in,
   which is why +100 means "one whole Pokemon ahead on the exchange" and why it
   can exceed 100 once the search is looking more than a turn ahead. */
const material=S=>S.th.reduce((n,h)=>n+(1-h),0)-S.mh.reduce((n,h)=>n+(1-h),0);

/* The horizon. Material, plus a small term for the matchup you are left in --
   without it, a search that stops right after a switch sees only the hit taken
   and never the reason you switched. */
function leaf(sim,S){
  const m=material(S);
  if(S.mi<0||S.ti<0) return m;                   // mid-substitution: no matchup yet
  /* Scaled by the stages standing on the board. Without this the horizon
     cannot see a boost at all, and a Dragon Dance one turn before the leaf is
     worth exactly nothing -- which is the bug depth was supposed to fix. */
  const o=sim.out[S.mi][S.ti].map((v,k)=>v*dmgMul(S.ms,S.ts,sim.catM[S.mi][k]==='physical'));
  const i=sim.inc[S.ti][S.mi].map((v,k)=>v*dmgMul(S.ts,S.ms,sim.catT[S.ti][k]==='physical'));
  const best=l=>l.length?Math.max(...l):0;
  return m+POS_W*Math.max(-1,Math.min(1,best(o)-best(i)));
}

/* V(S, d). The recursion at the top of this section, with a cache and a
   budget. Returns the leaf value once the budget is spent, which degrades the
   answer rather than hanging the tab. */
function stateValue(sim,S,d,ctx){
  if(d<=0||aliveCount(S.mh)===0||aliveCount(S.th)===0) return leaf(sim,S);
  if(ctx.n>NODE_BUDGET) return leaf(sim,S);
  const key=d+'|'+S.mi+','+S.ti+'|'+S.mh.join(',')+'|'+S.th.join(',')
    +'|'+stageKey(S.ms)+stageKey(S.ts);
  const hit=ctx.cache.get(key);
  if(hit!==undefined) return hit;
  const RA=actsMe(sim,S), RB=actsThem(sim,S);
  if(!RA.length||!RB.length) return leaf(sim,S);
  ctx.n+=RA.length*RB.length;
  const A=RA.map(a=>RB.map(b=>stateValue(sim,stepTurn(sim,S,a,b),d-1,ctx)));
  const sol=solveZeroSum(A);
  const v=sol?sol.value:Math.max(...A.map(r=>Math.min(...r)));
  ctx.cache.set(key,v);
  return v;
}

/* Build the board. Rows are what YOU can do, columns are what THEY can do,
   and each cell is how the battle stands `depth` turns later if you both pick
   that -- measured against where it stands now, so 0 is "no better or worse". */
function turnGame(me,o,others,theirRest,depth){
  if(!me||!o) return null;
  /* Clamped to what the control offers. Depth 4 spends the whole node budget
     on a real 6v6 and then falls back to the shallow estimate in places, which
     is a WORSE answer wearing a deeper label -- the one outcome a depth
     control must not have. */
  const d=Math.max(1,Math.min(3,depth|0||1));
  /* A teammate whose moves the roster does not document is left OUT of their
     switch options rather than treated as harmless. Including it would price
     a switch to it at zero damage, which understates their threat -- an error
     in the one direction this board must never make. */
  const undocumented=(theirRest||[]).filter(x=>!(x.m||[]).filter(mv=>MOVES[mv]).length).length;
  const theirTeam=[o].concat((theirRest||[]).filter(x=>(x.m||[]).filter(mv=>MOVES[mv]).length));
  if(!(o.m||[]).filter(mv=>MOVES[mv]).length) return null;   // no board to build
  const myTeam=[me].concat(others||[]);
  const sim=buildSim(myTeam,theirTeam);
  const S0={mi:0,ti:0,mh:myTeam.map(()=>1),th:theirTeam.map(()=>1),
            ms:STAGE0,ts:STAGE0};
  const rows=actsMe(sim,S0), cols=actsThem(sim,S0);
  if(!rows.length||!cols.length) return null;

  rows.forEach(r=>{ r.mon=r.kind==='switch'?myTeam[r.i].name:null;
                    r.label=r.kind==='switch'?`switch to ${r.mon}`:r.mv; });
  cols.forEach(c=>{ c.mon=c.kind==='switch'?theirTeam[c.i].n:null;
                    c.label=c.kind==='switch'?`switch to ${c.mon}`:c.mv; });

  const ctx={cache:new Map(),n:0};
  const base=leaf(sim,S0);
  const A=rows.map(a=>cols.map(b=>stateValue(sim,stepTurn(sim,S0,a,b),d-1,ctx)-base));
  return {rows,cols,A,sim,me,o,depth:d,om:oppMon(o),
          nodes:ctx.n,capped:ctx.n>NODE_BUDGET,undocumented,
          myTeam,theirTeam};
}

/* Solve a zero-sum matrix game for its value and both mixed strategies.

   By linear programming, via the standard reduction: shift every payoff
   positive, solve the column player's  max 1'z  s.t.  Bz <= 1, z >= 0  by
   simplex, and read the row player's strategy off the DUAL -- the objective
   row under the slack columns at optimality. The value is 1/(1'z), shifted
   back. Every b_i is 1, so the origin is feasible and no phase 1 is needed.

   Returns null only if the tableau degenerates, which a game with finite
   payoffs cannot do; the guard is there so a bug cannot spin. */
function solveZeroSum(A){
  const m=A.length, n=A[0].length;
  let lo=Infinity;
  for(const r of A) for(const v of r) lo=Math.min(lo,v);
  const K=1-lo, B=A.map(r=>r.map(v=>v+K));
  const W=n+m+1, T=[];
  for(let i=0;i<m;i++){
    const row=new Array(W).fill(0);
    for(let j=0;j<n;j++) row[j]=B[i][j];
    row[n+i]=1; row[W-1]=1; T.push(row);
  }
  const obj=new Array(W).fill(0);
  for(let j=0;j<n;j++) obj[j]=-1;
  const basis=[]; for(let i=0;i<m;i++) basis.push(n+i);
  for(let g=0;g<400;g++){
    let col=-1,best=-1e-9;
    for(let j=0;j<W-1;j++) if(obj[j]<best){best=obj[j];col=j;}
    if(col<0) break;                                    // optimal
    let row=-1,ratio=Infinity;
    for(let i=0;i<m;i++) if(T[i][col]>1e-9){
      const r=T[i][W-1]/T[i][col];
      if(r<ratio-1e-12){ratio=r;row=i;}
    }
    if(row<0) return null;                              // unbounded
    const piv=T[row][col];
    for(let j=0;j<W;j++) T[row][j]/=piv;
    for(let i=0;i<m;i++) if(i!==row&&Math.abs(T[i][col])>1e-12){
      const f=T[i][col];
      for(let j=0;j<W;j++) T[i][j]-=f*T[row][j];
    }
    const f=obj[col];
    for(let j=0;j<W;j++) obj[j]-=f*T[row][j];
    basis[row]=col;
  }
  const sum=obj[W-1];
  if(!(sum>1e-9)) return null;
  const v=1/sum;
  const z=new Array(n).fill(0);
  for(let i=0;i<m;i++) if(basis[i]<n) z[basis[i]]=T[i][W-1];
  return {value:v-K, x:Array.from({length:m},(_,i)=>Math.max(0,obj[n+i]*v)),
          y:z.map(t=>Math.max(0,t*v))};
}

/* Read the board: the security level, whether anything dominates, and the mix. */
function gameRead(g){
  const {rows,cols,A}=g;
  const mins=A.map(r=>Math.min(...r));
  const secure=Math.max(...mins);
  const best=mins.indexOf(secure);
  const minimax=Math.min(...cols.map((_,j)=>Math.max(...A.map(r=>r[j]))));
  const saddle=Math.abs(secure-minimax)<1e-9;
  /* A DOMINANT ROW is the answer worth having: at least as good as every other
     row against every column, so the guess does not matter. Weak dominance is
     the right test -- a move that ties elsewhere and wins somewhere still means
     you never need to think about it. */
  const dom=[];
  for(let i=0;i<rows.length;i++){
    let ok=true;
    for(let k=0;k<rows.length&&ok;k++){
      if(k===i) continue;
      for(let j=0;j<cols.length;j++) if(A[i][j]<A[k][j]-1e-9){ok=false;break;}
    }
    if(ok) dom.push(i);
  }
  return {mins,secure,best,minimax,saddle,dominant:dom.length?dom[0]:-1,dom,
          sol:solveZeroSum(A)};
}

/* The payoff scale reuses the effectiveness colours, so a good cell here is
   the same green as a good multiplier everywhere else on the page. Clamped at
   one Pokemon-equivalent in either direction: past a turn the numbers run
